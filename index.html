<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal de Processos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --head:#202C33; --stripe:#0164AF; --brand:#004077; --brand-2:#0164AF; --red:#E30613; --icon:#3584BF; --navy:#14275C;
  --bg:#F5F6F8; --sheet:#FFFFFF; --paper:#F5F6F8; --ink:#252525; --ink-2:#5B6570; --ink-3:#8A949E;
  --rule:#E5E8EC; --card-line:#EEEEEE; --field:#C5C5C5; --disabled:#E9ECEF;
  --carbon:#004077; --carbon-ink:#FFFFFF; --carbon-soft:#E6EEF6;
  --ok:#1E7B4A; --ok-soft:#E4F3EA; --bad:#C62828; --bad-soft:#FCE9E9; --warn:#9A5B00; --warn-soft:#FDF2DE;
  --focus:#0164AF; color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Work Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}

/* Topo */
.topbar{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:18px;height:72px;padding:0 24px;background:var(--head);border-bottom:4px solid var(--stripe);color:#fff}
.logo{height:42px;width:auto;display:block}
.menu-btn{display:none;width:42px;height:36px;border:1.5px solid #fff;border-radius:6px;background:none;color:#fff;cursor:pointer;align-items:center;justify-content:center}
.menu-btn svg{width:20px;height:20px}
.crumbs{justify-self:center;font-weight:600;font-size:16px;color:#B9C4CC;display:flex;gap:10px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs .sep{color:var(--icon);font-weight:400}
.crumbs .cur{color:#fff}
.who{font-size:14px;color:#C9D1D8;text-align:right;line-height:1.35}
.who strong{color:#fff;font-weight:600}
.who .btn.link{color:#fff;font-size:13px}

/* Estrutura */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 76px)}
.layout.noside{grid-template-columns:minmax(0,1fr)}
.side{background:var(--sheet);border-right:1px solid var(--rule);padding:16px 0 24px;position:sticky;top:76px;height:calc(100vh - 76px);overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 20px;border:0;background:none;color:var(--ink);font-size:16px;text-align:left;cursor:pointer;position:relative}
.nav-item:hover{background:#F3F6F9}
.nav-item svg{width:20px;height:20px;color:var(--icon);flex:none}
.nav-item.active{color:var(--navy);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:3px;background:var(--red)}
.nav-sub .nav-item{padding:8px 20px 8px 52px;font-size:15px}
.nav-label{padding:18px 20px 6px;font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.06em}
.nav-item .count{margin-left:auto}
.content{padding:28px 32px 64px;min-width:0}
.scrim{display:none;border:0;padding:0;margin:0}

/* Página */
#view.page{background:var(--sheet);border:1px solid var(--card-line);border-radius:4px;padding:28px 32px 32px;max-width:1100px;margin:0 auto}
#banner{max-width:1100px;margin:0 auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 20px;flex-wrap:wrap}
h2{font-size:26px;font-weight:700;margin:0;letter-spacing:-0.01em;color:var(--ink);display:flex;align-items:center;gap:12px}
h3{font-size:17px;font-weight:700;margin:28px 0 10px;color:var(--navy)}
.back{display:inline-flex;width:24px;height:24px;border:1.6px solid var(--navy);border-radius:50%;background:none;color:var(--navy);align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none}
.back svg{width:12px;height:12px}
.muted{color:var(--ink-2)}
.small{font-size:14px}
code{background:var(--disabled);padding:1px 5px;border-radius:3px;font-size:14px}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:4px;border:1px solid var(--field);background:var(--sheet);padding:8px 16px;font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.btn.link{border:0;background:none;padding:0;color:var(--brand-2);text-decoration:underline;text-underline-offset:3px}

/* Avisos */
.notice{border:1px solid var(--rule);border-left:4px solid var(--warn);background:var(--sheet);padding:12px 16px;margin:0 0 16px;font-size:15px;border-radius:4px}
.notice.err{border-left-color:var(--bad)}
.notice.ok{border-left-color:var(--ok)}
.empty{padding:36px 20px;text-align:center;color:var(--ink-2);border:1px dashed var(--field);border-radius:4px;background:var(--sheet)}

/* Lista de solicitações (canhoto) */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:120px 1fr auto;align-items:stretch;width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:0;text-align:left;cursor:pointer;position:relative}
.row:hover{border-color:var(--icon)}
.row[aria-expanded="true"]{border-color:var(--navy);border-bottom-left-radius:0;border-bottom-right-radius:0}
.stub{padding:14px;border-right:2px dashed var(--rule);position:relative;display:flex;flex-direction:column;justify-content:center;gap:2px;background:#FAFBFC}
.stub::before,.stub::after{content:"";position:absolute;right:-8px;width:14px;height:14px;border-radius:50%;background:var(--sheet);border:1px solid var(--rule)}
.stub::before{top:-8px}.stub::after{bottom:-8px}
.code{font-weight:600;font-size:13px;letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--navy)}
.date{font-size:13px;color:var(--ink-2)}
.rbody{padding:14px 16px;min-width:0}
.desc{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:14px;color:var(--ink-2);display:flex;gap:14px;flex-wrap:wrap;margin-top:2px}
.rend{padding:14px 16px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:6px}
.amt{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.s-aguardando_financeiro{color:var(--brand-2)}
.s-aprovado{color:var(--ok)}
.s-pago{color:var(--ok);background:var(--ok-soft)}
.s-devolvido{color:var(--warn)}
.s-recusado{color:var(--bad)}
.s-cancelado{color:var(--ink-3)}
.cancelrow{margin-top:14px}
.cancelbox{margin-top:16px;padding:14px 16px;border:1px solid #F3C9C9;background:#FFF8F8;border-radius:4px}
.cancelbox .hint{margin:6px 0 0}
.flag{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:1px 6px;border-radius:3px}

/* Detalhe */
.detail{background:var(--sheet);border:1px solid var(--navy);border-top:0;margin-top:-10px;padding:22px 22px 24px;position:relative;overflow:hidden;border-radius:0 0 4px 4px}
.stamp{position:absolute;top:18px;right:22px;transform:rotate(-7deg);border:3px double currentColor;border-radius:6px;padding:6px 14px;font-weight:700;font-size:20px;letter-spacing:.04em;opacity:.9;pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px 24px;margin:0 0 18px;padding-right:180px}
.grid dt{font-size:13px;color:var(--ink-2)}
.grid dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.full{grid-column:1/-1}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--rule)}
.timeline li{padding:0 0 12px 16px;position:relative;font-size:14px}
.timeline li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--sheet);border:2px solid var(--icon)}
.timeline .when{color:var(--ink-2)}
.timeline .cmt{display:block;margin-top:2px;color:var(--ink);font-style:italic}
.actions{margin-top:18px;padding-top:18px;border-top:1px solid var(--rule)}
.actions .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.progress{font-size:14px;color:var(--ink-2);margin-top:10px}
.tablewrap{overflow-x:auto;margin:0 0 6px}
table.items{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
table.items th{text-align:left;font-weight:600;color:var(--navy);border-bottom:1px solid var(--rule);padding:6px 8px}
table.items td{border-bottom:1px solid var(--rule);padding:8px;vertical-align:top}
table.items .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.items .n{width:28px;color:var(--ink-2)}
table.items tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--navy)}

/* Formulários (padrão da intranet) */
form.sheet,.panel{background:var(--sheet);border:1px solid var(--card-line);border-radius:4px;padding:24px;margin-bottom:24px}
form.sheet{border-top:3px solid var(--brand)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px}
.fields.one{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.wide{grid-column:1/-1}
label,.lbl{font-size:14px;font-weight:500;color:var(--ink)}
.hint{font-size:13px;color:var(--ink-2)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid var(--field);background:#fff;border-radius:4px;padding:8px 12px;font-size:16px;min-height:40px}
input:disabled,select:disabled,textarea:disabled{background:var(--disabled)}
input::placeholder,textarea::placeholder{color:#9AA1A8}
textarea{min-height:76px;resize:vertical}
input[type=file]{font-size:14px}
.err{font-size:13px;color:var(--bad)}
.radios{display:flex;gap:22px;padding:8px 0}
.radios label{font-weight:400;display:flex;gap:8px;align-items:center;cursor:pointer}
.formfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
fieldset.item{border:1px solid var(--rule);border-left:3px solid var(--icon);border-radius:4px;padding:14px 16px 16px;margin:0 0 12px;position:relative;min-width:0}
fieldset.item legend{font-weight:600;font-size:14px;padding:0 6px;color:var(--navy)}
fieldset.item .rm{position:absolute;top:10px;right:14px;font-size:14px}
.deadline{margin:-6px 0 18px;font-size:14px;color:var(--ink-2);border-left:3px solid var(--red);padding:2px 0 2px 10px}
.totalbar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:18px;padding:14px 0 0;border-top:2px solid var(--navy)}
.totalbar strong{font-size:26px;font-variant-numeric:tabular-nums;color:var(--navy)}
.totals{display:flex;gap:28px;flex-wrap:wrap;margin:0 0 18px}
.totals div{font-size:14px;color:var(--ink-2)}
.totals strong{display:block;font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums}
.limits{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 18px}
.count{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:600;text-align:center;line-height:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Login */
.authwrap{max-width:440px;margin:40px auto 0}
.authwrap .panel{border-top:4px solid var(--brand);padding:30px}
.authhead{text-align:center;margin-bottom:18px}
.authhead img{height:54px;width:auto;margin:0 auto 14px;display:block}
.authhead h2{justify-content:center;font-size:24px}
.authhead p{margin:4px 0 0;color:var(--ink-2);font-size:15px}
.authlinks{display:flex;gap:18px;flex-wrap:wrap}

/* Usuários */
.panel.tight{padding:4px 18px}
.userrow{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule)}
.userrow:last-child{border-bottom:0}
.uact{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.uact select{width:auto}
.u-pendente{color:var(--warn)}.u-aprovado{color:var(--ok)}.u-bloqueado{color:var(--bad)}

/* Início */
.hello{max-width:1100px;margin:0 auto 22px}
.hello h2{font-size:28px}
.hello p{margin:4px 0 0}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;max-width:1100px;margin:0 auto}
.proc{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--sheet);border:1px solid var(--card-line);border-top:4px solid var(--stripe);border-radius:4px;padding:24px;min-height:230px;cursor:pointer;color:var(--ink);transition:border-color .15s, box-shadow .15s, transform .15s}
.proc:hover{border-color:#D5DCE3;border-top-color:var(--red);box-shadow:0 6px 18px rgba(32,44,51,.08)}
.proc.small{min-height:0;border-top-color:var(--head)}
.proc .ico{width:44px;height:44px;color:var(--icon)}
.proc .ico svg{width:100%;height:100%}
.ptitle{font-size:19px;font-weight:700;color:var(--navy)}
.pdesc{font-size:15px;color:var(--ink-2)}
.pstatus{display:flex;flex-wrap:wrap;gap:6px}
.pstatus:empty{display:none}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;background:var(--carbon-soft);color:var(--brand)}
.pill.hot{background:var(--red);color:#fff}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pgo{margin-top:auto;font-weight:600;color:var(--brand-2);font-size:15px}
.admin-h{max-width:1100px;margin:36px auto 12px}
@media (prefers-reduced-motion: no-preference){
  .proc:hover{transform:translateY(-2px)}
  .stamp{animation:thud .28s ease-out}
  @keyframes thud{from{transform:rotate(-7deg) scale(1.35);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:.9}}
}

/* Celular */
@media (max-width:900px){
  .topbar{grid-template-columns:auto auto 1fr;padding:0 14px;gap:12px}
  .topbar .crumbs{display:none}
  .menu-btn{display:inline-flex}
  .logo{height:34px}
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:76px;bottom:0;height:auto;width:270px;z-index:25;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 18px rgba(0,0,0,.12)}
  .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:76px 0 0 0;background:rgba(32,44,51,.35);z-index:24}
  .content{padding:18px 14px 48px}
  #view.page{padding:20px 16px}
}
@media (max-width:640px){
  .row{grid-template-columns:1fr auto}
  .stub{display:none}
  .fields{grid-template-columns:1fr}
  .grid{padding-right:0;padding-top:46px}
  .stamp{font-size:16px}
  .userrow{grid-template-columns:1fr}
  .uact{justify-content:flex-start}
  .who{font-size:13px}
}

/* Chamados de TI */
:root{--ice:#1C6E8C;--ice-soft:#E0F1F7}
.t-aberto{color:var(--brand-2)}
.t-aguardando_material{color:var(--warn)}
.t-em_andamento{color:var(--ok)}
.t-concluido{color:var(--ok);background:var(--ok-soft)}
.t-cancelado{color:var(--bad)}
.t-congelado{color:var(--ice);background:var(--ice-soft)}
.stamp.t-concluido,.stamp.t-congelado{background:none}
.prz{font-weight:600;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.prz.late,.flag.late{color:var(--bad)}
.flag.late{background:var(--bad-soft)}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:12px 14px}
ul.att{margin:10px 0 0;padding-left:20px;font-size:14px}
.tiform{display:flex;flex-direction:column;gap:12px;max-width:560px}
input[type=datetime-local]{width:100%;border:1px solid var(--field);background:#fff;border-radius:4px;padding:8px 12px;font-size:16px;min-height:40px}
.pill.ti{background:var(--ice-soft);color:var(--ice)}

/* Notificações */
.tright{display:flex;align-items:center;gap:16px}
.bell{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:none;color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.bell:hover{background:rgba(255,255,255,.1)}
.bell svg{width:22px;height:22px}
.bell .bdg{position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.notif{position:fixed;top:80px;right:16px;width:min(400px,calc(100vw - 32px));max-height:min(70vh,560px);display:flex;flex-direction:column;background:#fff;border:1px solid var(--card-line);border-radius:6px;box-shadow:0 12px 32px rgba(32,44,51,.18);z-index:40}
.notif-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--rule)}
.notif-head strong{font-size:16px;color:var(--navy)}
.notif-list{overflow-y:auto}
.nitem{display:grid;grid-template-columns:10px 1fr;gap:10px;width:100%;padding:12px 16px;border:0;border-bottom:1px solid var(--rule);background:#fff;text-align:left;cursor:pointer;font-size:14px;color:var(--ink)}
.nitem:hover{background:#F3F6F9}
.nitem .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:transparent}
.nitem.unread{background:#F5F9FD}
.nitem.unread .dot{background:var(--red)}
.nitem .nt{display:block}
.nitem .nsub{display:block;color:var(--ink-2);font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nitem .nbody{display:block;color:var(--ink);font-size:13px;margin-top:4px;font-style:italic;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nitem .nwhen{display:block;color:var(--ink-3);font-size:12px;margin-top:4px}
.notif-empty{padding:28px 16px;text-align:center;color:var(--ink-2);font-size:14px}
/* Menções */
.mention{color:var(--brand-2);font-weight:600;font-style:normal}
.mention-pop{position:absolute;z-index:50;background:#fff;border:1px solid var(--field);border-radius:4px;box-shadow:0 8px 20px rgba(32,44,51,.15);max-height:240px;overflow-y:auto;min-width:220px}
.mention-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
.mention-pop button.on,.mention-pop button:hover{background:var(--carbon-soft)}
.mhint{font-size:12px;color:var(--ink-3);margin-top:4px}
.commentbox{margin-top:16px;padding:14px 16px;border:1px solid var(--rule);background:#FAFBFC;border-radius:4px}
.focusbox{margin:0 0 24px;padding-bottom:20px;border-bottom:1px solid var(--rule)}
.focusbox h3{margin-top:0}
@media (max-width:640px){.tright{gap:8px}.who{display:none}.notif{top:80px;right:8px;left:8px;width:auto}}
</style>
</head>
<body>
<header class="topbar">
  <button class="menu-btn" id="menu-btn" data-action="menu" aria-label="Abrir menu" aria-controls="side" aria-expanded="false" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  <img class="logo" id="logo" alt="Rede PRÓ">
  <div class="crumbs" id="crumbs"></div>
  <div class="tright">
    <button class="bell" id="bell" data-action="bell" aria-label="Notificações" aria-expanded="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg><span class="bdg" id="bell-n" hidden></span></button>
    <div class="who" id="who"></div>

function cleanSupabaseUrl(u){
  u=String(u||"").trim();
  let m=u.match(/^https?:\/\/([a-z0-9-]+)\.supabase\.(co|in)/i);
  if(m) return `https://${m[1].toLowerCase()}.supabase.${m[2].toLowerCase()}`;
  m=u.match(/supabase\.com\/dashboard\/project\/([a-z0-9]+)/i);
  if(m) return `https://${m[1].toLowerCase()}.supabase.co`;
  return "";
}

const $ = s => document.querySelector(s);
const h = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = n => (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function isoLocal(d){ const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
const todayISO = () => isoLocal(new Date());
const fmtDate = iso => { if(!iso) return ""; const [y,m,d]=String(iso).slice(0,10).split("-"); return `${d}/${m}/${y}`; };
const fmtDateShort = iso => { if(!iso) return ""; const d=new Date(String(iso).length===10?iso+"T12:00:00":iso); return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}).replace(".",""); };
const fmtWhen = iso => new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
function parseMoney(s){
  s = String(s??"").replace(/R\$|\s/g,"");
  if(!s) return NaN;
  if(s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  else if(/\.\d{3}($|\.)/.test(s)) s = s.replace(/\./g,"");
  return Math.round(parseFloat(s)*100)/100;
}

function dbMessage(e){
  const m = (e && (e.message||e.error_description||e.msg)) || "";
  if(/row-level security|permission denied/i.test(m)) return "Você não tem permissão para esta ação.";
  if(/Failed to fetch|NetworkError/i.test(m)) return "Sem conexão com o servidor. Verifique a internet e tente de novo.";
  if(/Invalid path specified/i.test(m)) return "A URL do Supabase no topo do index.html está errada. Ela deve ser só https://xxxx.supabase.co, sem nada depois.";
  if(/Invalid API key|No API key/i.test(m)) return "A chave do Supabase no topo do index.html está errada. Copie de novo a chave anon public.";
  return m || "Algo deu errado. Tente de novo.";
}

/* ---------- prazo: dia 5 do mês seguinte ---------- */
function deadlineFor(ym){ const [y,m]=ym.split("-").map(Number); return isoLocal(new Date(y,m,5,12)); }
function monthOpen(dateISO, refISO){ return refISO <= deadlineFor(dateISO.slice(0,7)); }
function monthName(iso){ return new Date(iso.slice(0,7)+"-15T12:00:00").toLocaleDateString("pt-BR",{month:"long",year:"numeric"}); }
function oldestOpenDate(refISO){
  const d=new Date(refISO+"T12:00:00"); const prev=isoLocal(new Date(d.getFullYear(), d.getMonth()-1, 1, 12));
  return monthOpen(prev, refISO) ? prev : refISO.slice(0,8)+"01";
}
function deadlineHint(refISO){
  const min=oldestOpenDate(refISO), cur=refISO.slice(0,7);
  const curTxt=`despesas de ${monthName(refISO)} até ${fmtDate(deadlineFor(cur))}`;
  if(min.slice(0,7)!==cur) return `Prazo: despesas de ${monthName(min)} podem ser enviadas até ${fmtDate(deadlineFor(min.slice(0,7)))}, e ${curTxt}.`;
  return `Prazo: ${curTxt}. Despesas de meses anteriores já não podem ser enviadas.`;
}

/* ---------- comprovantes ---------- */
async function shrinkImage(file, target){
  let bmp;
  try{ bmp = await createImageBitmap(file); }catch(e){ throw new Error("Não foi possível ler essa imagem. Envie em JPG, PNG ou PDF."); }
  let scale=Math.min(1, 2200/Math.max(bmp.width,bmp.height)), q=0.85;
  for(let i=0;i<7;i++){
    const c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(bmp.width*scale)); c.height=Math.max(1,Math.round(bmp.height*scale));
    const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q));
    if(blob && blob.size<=target) return blob;
    q=Math.max(0.5,q-0.1); scale*=0.82;
  }
  throw new Error("A imagem continua grande demais mesmo comprimida. Tire uma foto mais próxima do comprovante.");
}
const asciiName = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9._-]+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"").slice(0,80);
async function uploadReceipt(file, folder, n, item){
  let blob=file, type=(file.type||"").toLowerCase(), ext=(file.name.split(".").pop()||"").toLowerCase();
  if(!type && ext==="pdf") type="application/pdf";
  const isImg=/^image\//.test(type);
  if(isImg && (file.size>1500000 || !/^image\/(jpeg|png|webp)$/.test(type))){ blob=await shrinkImage(file,1500000); type="image/jpeg"; ext="jpg"; }
  else if(!isImg && type!=="application/pdf") throw new Error("Envie o comprovante em JPG, PNG ou PDF.");
  if(blob.size>20*1048576) throw new Error("O arquivo passa de 20 MB. Comprima o PDF ou envie uma foto.");
  const name=`${String(n).padStart(2,"0")}-${asciiName(item.category)}-${item.date}.${ext}`;
  const path=`${myId()}/${folder}/${Date.now().toString(36)}-${name}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType:type, upsert:false });
  if(error) throw new Error("Não foi possível enviar o comprovante: "+dbMessage(error));
  return { receipt_path:path, receipt_name:name, receipt_type:type };
}
async function openReceipt(path){
  const w = window.open("", "_blank");
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 600);
  if(error || !data){ if(w) w.close(); S.flash={kind:"warn", text:"Não foi possível abrir o comprovante: "+dbMessage(error)}; render(); return; }
  if(w) w.location = data.signedUrl; else location.href = data.signedUrl;
}

const normTxt = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function mentionsIn(text){
  const t=String(text||""); if(!t.includes("@")) return [];
  return [...new Set(N.dir.filter(u=>u.id!==myId() && t.includes("@"+u.full_name)).map(u=>u.id))];
}
function withMentions(entry){ const m=mentionsIn(entry.comment); return m.length ? {...entry, mentions:m} : entry; }
function fmtCmt(text){
  let out=h(text);
  if(!out.includes("@")) return out;
  [...N.dir].sort((a,b)=>b.full_name.length-a.full_name.length).forEach(u=>{
    const k=h("@"+u.full_name); if(out.includes(k)) out=out.split(k).join(`\u0000${u.id}\u0000`);
  });
  N.dir.forEach(u=>{ out=out.split(`\u0000${u.id}\u0000`).join(`<span class="mention">${h("@"+u.full_name)}</span>`); });
  return out;
}
const MP={el:null, field:null, start:0, items:[], idx:0};
function mentionClose(){ if(MP.el){ MP.el.remove(); MP.el=null; } MP.field=null; MP.items=[]; }
function mentionCheck(field){
  if(!N.dir.length){ mentionClose(); return; }
  const pos=field.selectionStart, before=field.value.slice(0,pos);
  const m=before.match(/(^|[\s(])@([^@\n]{0,40})$/);
  if(!m){ mentionClose(); return; }
  const raw=m[2], q=normTxt(raw).trim();
  if(/\s$/.test(raw) && N.dir.some(u=>normTxt(u.full_name)===q)){ mentionClose(); return; }
  const items=N.dir.filter(u=>u.id!==myId() && normTxt(u.full_name).includes(q)).slice(0,7);
  if(!items.length || q.split(/\s+/).length>4){ mentionClose(); return; }
  const st=pos-raw.length-1; if(MP.field!==field || MP.start!==st) MP.idx=0;
  MP.field=field; MP.start=st; MP.items=items; MP.idx=Math.min(MP.idx, items.length-1);
  if(!MP.el){ MP.el=document.createElement("div"); MP.el.className="mention-pop"; MP.el.setAttribute("role","listbox"); MP.el.addEventListener("mousedown", e=>e.preventDefault()); document.body.appendChild(MP.el); }
  const r=field.getBoundingClientRect();
  MP.el.style.top=(window.scrollY+r.bottom+4)+"px"; MP.el.style.left=(window.scrollX+r.left)+"px"; MP.el.style.width=Math.min(340,r.width)+"px";
  MP.el.innerHTML=items.map((u,i)=>`<button type="button" data-mpick="${i}" class="${i===MP.idx?"on":""}" role="option">${h(u.full_name)}</button>`).join("");
}
function mentionPick(i){
  const u=MP.items[i], f=MP.field; if(!u||!f) return;
  const pos=f.selectionStart, ins="@"+u.full_name+" ";
  f.value=f.value.slice(0,MP.start)+ins+f.value.slice(pos);
  const np=MP.start+ins.length; mentionClose(); f.focus(); f.setSelectionRange(np,np);
  f.dispatchEvent(new Event("input",{bubbles:true}));
}
const MENTION_HINT = `<div class="mhint">Digite @ para mencionar alguém. A pessoa recebe uma notificação.</div>`;
function relTime(iso){
  const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<60) return "agora"; if(s<3600) return `há ${Math.floor(s/60)} min`; if(s<86400) return `há ${Math.floor(s/3600)} h`;
  if(s<7*86400){ const d=Math.floor(s/86400); return d===1?"ontem":`há ${d} dias`; }
  return fmtDate(isoLocal(new Date(iso)));
}
function notifText(n){

  if(n.kind==="mencao") return `<strong>${h(n.actor_name||"Alguém")}</strong> mencionou você ${where} <strong>${h(n.ref_code||"")}</strong>`;

  return `<strong>${h(n.actor_name||"Alguém")}</strong>: ${h(String(lbl||"").toLowerCase())} <strong>${h(n.ref_code||"")}</strong>`;
}

const stepsHTML = steps => steps.length ? `<div class="progress" role="status">${steps.map(h).join("<br>")}</div>` : "";

async function submitForm(){
  const f=S.form, err={};
  const editing = S.editId ? S.requests.find(r=>r.id===S.editId) : null;
  const ref = editing ? isoLocal(new Date(editing.created_at)) : todayISO();
  const items = f.items||[];
  if(!f.title || f.title.trim().length<3) err.title="Dê um título curto, por exemplo “Visita a clientes em Campinas”.";
  if(!f.cost_center) err.cost_center="Selecione o motivo ou centro de custo.";
  if(!f.partner || f.partner.trim().length<2) err.partner="Informe o parceiro e loja, fornecedor, prospect ou evento.";
  if(f.on_behalf==="sim" && !(f.on_behalf_of||"").trim()) err.on_behalf_of="Informe para quem é o reembolso.";
  if(!f.pix || f.pix.trim().length<4) err.pix="Informe a chave Pix ou a conta bancária para o pagamento.";
  if(!items.length) err.items="Inclua pelo menos uma despesa.";
  items.forEach((it,i)=>{
    const k=x=>`i${i}_${x}`;
    if(!it.date) err[k("date")]="Informe a data.";
    else if(it.date>todayISO()) err[k("date")]="A data não pode estar no futuro.";
    else if(!monthOpen(it.date, ref)) err[k("date")]=`O prazo para despesas de ${monthName(it.date)} terminou em ${fmtDate(deadlineFor(it.date.slice(0,7)))}.`;
    if(!it.category) err[k("category")]="Escolha a categoria.";
    if(it.category==="Km"){ if(!(parseMoney(it.km)>0)) err[k("km")]="Informe os quilômetros rodados, ex.: 120."; }
    else if(!(parseMoney(it.amount)>0)) err[k("amount")]="Informe o valor, ex.: 89,90.";
    if(!it.description || it.description.trim().length<3) err[k("description")] = it.category==="Outros" ? "Em “Outros”, descreva qual é a despesa." : it.category==="Km" ? "Informe o trajeto, ex.: escritório até cliente X, ida e volta." : "Descreva a despesa.";
    if(!it.file && !it.receipt_path && it.category!=="Km") err[k("receipt")]="Anexe o comprovante.";
  });
  S.formErr=err;
  if(Object.keys(err).length){ renderForm(); const first=document.querySelector("form.sheet .err"); if(first) first.scrollIntoView({block:"center"}); return; }

  S.formBusy=true; S.formSteps=[]; renderForm();
  const step = t => { S.formSteps.push(t); renderForm(); };
  try{
    const folder = editing ? editing.id : (f.folder || (f.folder = crypto.randomUUID()));
    const withFiles=items.filter(it=>it.file).length; let sent=0;
    for(let i=0;i<items.length;i++){
      const it=items[i];
      if(it.file){
        sent++; step(`Enviando comprovante ${sent} de ${withFiles}…`);
        Object.assign(it, await uploadReceipt(it.file, folder, i+1, it));
        it.file=null;
      }
    }
    const clean=items.map(it=>{ const isKm=it.category==="Km";
      return { date:it.date, category:it.category, amount:itemValue(it), km:isKm?parseMoney(it.km):null, description:it.description.trim(),
        receipt_path:it.receipt_path||null, receipt_name:it.receipt_name||null, receipt_type:it.receipt_type||null }; });
    const payload={ title:f.title.trim(), cost_center:f.cost_center, partner:f.partner.trim(), on_behalf:f.on_behalf==="sim",
      on_behalf_of:f.on_behalf==="sim"?(f.on_behalf_of||"").trim():null, pix:f.pix.trim(), items:clean };
    step("Registrando a solicitação…");
    const now=new Date().toISOString();
    let res;
    if(editing){
      const history=[...(editing.history||[]), {at:now, by_name:S.profile.full_name, action:"reenviado", comment:(f.note||"").trim()}];
      res = await sb.from("requests").update({...payload, status:"aguardando_financeiro", history}).eq("id", editing.id).select().single();
    } else {
      res = await sb.from("requests").insert({...payload, history:[{at:now, by_name:S.profile.full_name, action:"enviado", comment:""}]}).select().single();
    }
    if(res.error) throw res.error;
    S.flash={kind:"ok", text:`Solicitação ${res.data.code} de ${brl(res.data.total)} enviada para o financeiro.`};
    S.showForm=false; S.editId=null; S.form={}; S.formErr={}; S.openId=res.data.id;
    await loadRequests();
  }catch(e){
    S.formErr={submit: e instanceof Error && !e.code ? e.message : dbMessage(e)};
  }finally{ S.formBusy=false; S.formSteps=[]; render(); }
}

async function act(id, kind){
  const r=S.requests.find(x=>x.id===id); if(!r) return;
  const comment=(S.comment[id]||"").trim();
  if(kind==="comentario"){
    const cc=(RC.cmt[id]||"").trim();
    if(cc.length<2){ S.steps[id]=["Escreva o comentário."]; render(); const t=document.getElementById("rc-"+id); if(t) t.focus(); return; }
    return act2(id, kind, r, cc);
  }
  if(kind==="cancelado"){
    const cc=(CANCEL.cmt[id]||"").trim();
    if(!isMine(r) && cc.length<3){ S.steps[id]=["Explique o motivo do cancelamento. O solicitante verá essa explicação."]; render(); const t=document.getElementById("ccmt-"+id); if(t) t.focus(); return; }
    return act2(id, kind, r, cc);
  }
  if((kind==="devolvido"||kind==="recusado") && comment.length<3){
    S.steps[id]=["Escreva um comentário explicando o motivo."]; render(); const t=document.getElementById("cmt-"+id); if(t) t.focus(); return;
  }
  return act2(id, kind, r, comment);
}
async function act2(id, kind, r, comment){
  const entry=withMentions({at:new Date().toISOString(), by_name:S.profile.full_name, action:kind, comment});
  const upd= kind==="comentario" ? { history:[...(r.history||[]), entry] } : { status:kind, history:[...(r.history||[]), entry] };
  if(kind==="pago") upd.paid_date=S.payDate[id]||todayISO();
  S.busy[id]=kind; S.steps[id]=["Salvando…"]; render();
  const { error } = await sb.from("requests").update(upd).eq("id", id);
  if(error){ S.steps[id]=[dbMessage(error)]; }
  else { if(kind==="cancelado"){ CANCEL.open[id]=false; CANCEL.cmt[id]=""; } else S.comment[id]=""; S.steps[id]=[]; if(kind==="comentario"){ RC.open[id]=false; RC.cmt[id]=""; } S.flash={kind:"ok", text: kind==="comentario" ? `${r.code}: comentário enviado.` : `${r.code}: ${STATUS[kind]}.`}; await loadRequests(); }
  S.busy[id]=null; render();
}

    "Código":r.code, "Título":r.title, "Solicitante":reqName(r), "E-mail":(r.requester&&r.requester.email)||"",
    "Em nome de outro colaborador":r.on_behalf?"Sim":"Não", "Para quem":r.on_behalf_of||"",
    "Motivo / centro de custo":r.cost_center, "Parceiro, fornecedor, prospect ou evento":r.partner,
    "Período":dateRange(r), "Qtd. de despesas":(r.items||[]).length, "Total (R$)":Number(r.total)||0,
    "Status":STATUS[r.status]||r.status, "Pix ou conta bancária":r.pix,
    "Enviado em":fmtDate(r.created_at.slice(0,10)), "Aprovado em":histAt(r,"aprovado"), "Pago em":r.paid_date?fmtDate(r.paid_date):""
  }));
  const irows=[]; reqs.forEach(r=>(r.items||[]).forEach((it,i)=>irows.push({
    "Código":r.code, "Item":i+1, "Data":fmtDate(it.date), "Categoria":it.category, "Descrição":it.description,
    "Km rodados":it.km||"", "Valor (R$)":Number(it.amount)||0, "Acima do teto":it.over_limit?"Sim":"",
    "Solicitante":reqName(r), "Status":STATUS[r.status]||r.status, "Comprovante":it.receipt_path?"Anexado":""
  })));
  const money=(ws,n,col)=>{ for(let i=0;i<n;i++){ const c=ws[XLSX.utils.encode_cell({r:i+1,c:col})]; if(c) c.z='"R$" #,##0.00'; } };
  const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{"Código":""}]); money(ws,rows.length,10);
  ws["!cols"]=[16,30,24,28,12,22,24,30,24,10,14,20,30,12,12,12].map(w=>({wch:w}));
  const wi=XLSX.utils.json_to_sheet(irows.length?irows:[{"Código":""}]); money(wi,irows.length,6);
  wi["!cols"]=[16,6,12,16,40,10,14,12,24,20,12].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Solicitações"); XLSX.utils.book_append_sheet(wb,wi,"Despesas");
  XLSX.writeFile(wb, `Controle de reembolsos ${todayISO()}.xlsx`);
}

/* ---------- autenticação ---------- */
const redirectTo = () => location.origin + location.pathname;
function authErrorMessage(e){
  const m=(e&&e.message)||"";
  if(/invalid login credentials/i.test(m)) return "E-mail ou senha incorretos.";
  if(/email not confirmed/i.test(m)) return "Confirme seu e-mail pelo link que enviamos antes de entrar.";
  if(/already registered|already exists/i.test(m)) return "Este e-mail já tem cadastro. Use “Entrar” ou “Esqueci minha senha”.";
  if(/rate limit|too many/i.test(m)) return "Muitas tentativas seguidas. Aguarde alguns minutos e tente de novo.";
  if(/password/i.test(m) && /least|short|weak/i.test(m)) return "A senha precisa ter pelo menos 8 caracteres.";
  return dbMessage(e);
}
async function authSubmit(){
  const a=S.auth, mode=S.authMode;
  S.authErr=null; S.authMsg=null;
  const email=(a.email||"").trim().toLowerCase();
  if(mode!=="recovery" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ S.authErr="Informe um e-mail válido."; return renderAuth(); }
  if(mode==="signup"){
    if(!(a.name||"").trim()) { S.authErr="Informe seu nome completo."; return renderAuth(); }
    if((a.password||"").length<8){ S.authErr="A senha precisa ter pelo menos 8 caracteres."; return renderAuth(); }
    if(a.password!==a.password2){ S.authErr="As senhas não conferem."; return renderAuth(); }
  }
  if(mode==="recovery"){
    if((a.password||"").length<8){ S.authErr="A senha precisa ter pelo menos 8 caracteres."; return renderAuth(); }
    if(a.password!==a.password2){ S.authErr="As senhas não conferem."; return renderAuth(); }
  }
  S.authBusy=true; renderAuth();
  try{
    if(mode==="login"){
      const { error } = await sb.auth.signInWithPassword({ email, password:a.password||"" });
      if(error) throw error;
    } else if(mode==="signup"){
      const { data, error } = await sb.auth.signUp({ email, password:a.password, options:{ data:{ full_name:a.name.trim() }, emailRedirectTo:redirectTo() } });
      if(error) throw error;
      if(!data.session){ S.authMode="login"; S.auth={email}; S.authMsg=`Enviamos um link de confirmação para ${email}. Depois de confirmar, seu acesso aguarda a aprovação da administradora.`; }
    } else if(mode==="forgot"){
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo:redirectTo() });
      if(error) throw error;
      S.authMode="login"; S.authMsg=`Se houver uma conta com ${email}, enviamos um link para criar uma nova senha.`;
    } else if(mode==="recovery"){
      const { error } = await sb.auth.updateUser({ password:a.password });
      if(error) throw error;
      S.authMode="login"; S.auth={}; S.flash={kind:"ok", text:"Senha alterada."};
      await loadAll(); return;
    }
  }catch(e){ S.authErr=authErrorMessage(e); }
  finally{ S.authBusy=false; }
  render();
}

function preserveFocus(fn){
  const a=document.activeElement, id=a&&a.id, s=a&&a.selectionStart, e=a&&a.selectionEnd;
  fn();
  if(id){ const n=document.getElementById(id); if(n && n!==document.activeElement){ n.focus(); try{ if(s!=null) n.setSelectionRange(s,e); }catch(_){} } }
}

/* ---------- anexos ---------- */
async function tiUpload(file, folder){
  let blob=file, ext=(file.name.split(".").pop()||"").toLowerCase(), type=TI_TYPES[ext]||(file.type||"").toLowerCase();
  if(!Object.values(TI_TYPES).includes(type)) throw new Error(`“${file.name}”: tipo de arquivo não aceito. Envie PDF, imagem, Word, Excel, PowerPoint, CSV, TXT ou ZIP.`);
  if(/^image\//.test(type) && type!=="image/gif" && file.size>1500000){ blob=await shrinkImage(file,1500000); type="image/jpeg"; ext="jpg"; }
  if(blob.size>20*1048576) throw new Error(`“${file.name}” passa de 20 MB.`);
  const base=asciiName(file.name.replace(/\.[^.]+$/,""))||"arquivo";
  const path=`${myId()}/${folder}/${Date.now().toString(36)}-${base}.${ext}`;
  const { error } = await sb.storage.from(TI_BUCKET).upload(path, blob, { contentType:type, upsert:false });
  if(error) throw new Error(`Não foi possível enviar “${file.name}”: ${dbMessage(error)}`);
  return { path, name:file.name, type, size:blob.size, by_name:S.profile.full_name, at:new Date().toISOString() };
}
async function tiUploadAll(key, folder, step){
  const fs=T.files[key]||[], out=[];
  for(let i=0;i<fs.length;i++){ step(`Enviando arquivo ${i+1} de ${fs.length}…`); out.push(await tiUpload(fs[i], folder)); }
  return out;
}
async function tiOpenFile(path){
  const w=window.open("", "_blank");
  const { data, error } = await sb.storage.from(TI_BUCKET).createSignedUrl(path, 600);
  if(error || !data){ if(w) w.close(); S.flash={kind:"warn", text:"Não foi possível abrir o arquivo: "+dbMessage(error)}; render(); return; }
  if(w) w.location=data.signedUrl; else location.href=data.signedUrl;
}
const tiFilesHint = key => { const fs=T.files[key]||[]; return fs.length ? fs.map(f=>h(f.name)).join(", ") : "PDF, imagem, Word, Excel, PowerPoint, CSV ou ZIP, até 20 MB cada"; };

async function tiSubmit(){
  const f=T.form, err={};
  if(!f.title || f.title.trim().length<3) err.title="Dê um título curto, por exemplo “Relatório de vendas por loja”.";
  if(!f.category) err.category="Escolha o tipo de demanda.";
  if(!f.description || f.description.trim().length<10) err.description="Explique a demanda: o que precisa, para quem e por quê.";
  if(f.needs_meeting!=="sim" && f.needs_meeting!=="nao") err.needs_meeting="Diga se precisa de uma reunião para explicar a demanda.";
  if(f.desired_date && f.desired_date<todayISO()) err.desired_date="A data desejada não pode estar no passado.";
  T.formErr=err;
  if(Object.keys(err).length){ tiRenderForm(); const first=document.querySelector("#ti-form .err"); if(first) first.scrollIntoView({block:"center"}); return; }
  T.formBusy=true; T.formSteps=[]; tiRenderForm();
  const step=t=>{ T.formSteps.push(t); tiRenderForm(); };
  try{
    const id=f.id||(f.id=crypto.randomUUID());
    if(!f.uploaded) f.uploaded=await tiUploadAll("new", id, step);
    step("Registrando o chamado…");
    const now=new Date().toISOString();
    const res=await sb.from("chamados").insert({
      id, title:f.title.trim(), category:f.category, urgency:f.urgency||"Média", desired_date:f.desired_date||null,
      description:f.description.trim(), needs_meeting:f.needs_meeting==="sim", meeting_pref:f.needs_meeting==="sim"?(f.meeting_pref||"").trim():null,
      materials:(f.materials||"").trim()||null, attachments:f.uploaded,
      history:[{at:now, by_name:S.profile.full_name, action:"aberto", comment:""}]
    }).select().single();
    if(res.error) throw res.error;
    S.flash={kind:"ok", text:`Chamado ${res.data.code} aberto. A equipe de TI vai verificar se tem tudo o que precisa.`};
    T.showForm=false; T.form={}; T.formErr={}; T.files.new=[]; T.openId=res.data.id;
    await loadChamados();
  }catch(e){
    T.formErr={submit: e instanceof Error && !e.code ? e.message : tiDbMessage(e)};
  }finally{ T.formBusy=false; T.formSteps=[]; render(); }
}

/* ---------- ações ---------- */
const TI_MODES = {
  previsao:{label:c=>c.status==="aguardando_material"?"Material completo, dar previsão":"Tenho tudo, dar previsão", cls:"ok"},
  falta:{label:c=>c.status==="aguardando_material"?"Atualizar pendências":c.status==="em_andamento"?"Solicitar material":"Falta material", cls:""},
  revisar:{label:()=>"Revisar prazo", cls:""},
  reuniao:{label:c=>c.meeting_at?"Remarcar reunião":"Registrar reunião", cls:""},
  concluir:{label:()=>"Concluir", cls:"ok"},
  congelar:{label:()=>"Congelar", cls:""},
  descongelar:{label:()=>"Retomar chamado", cls:"ok"},
  material:{label:()=>"Enviar material pendente", cls:"primary"},
  comentario:{label:()=>"Comentar", cls:""},
  cancelar:{label:()=>"Cancelar chamado", cls:"bad"}
};
function tiModesFor(c){
  const out=[], it=isTI(), mine=tiMine(c), s=c.status;
  if(mine && s==="aguardando_material") out.push("material");
  if(it){
    if(s==="aberto"||s==="aguardando_material") out.push("previsao","falta");
    if(s==="em_andamento") out.push("concluir","revisar","falta");
    if(s==="aguardando_material" && c.prazo) out.push("revisar");
    if(TI_ACTIVE.includes(s) && c.needs_meeting) out.push("reuniao");
    if(TI_ACTIVE.includes(s)) out.push("congelar");
    if(s==="congelado") out.push("descongelar");
  }
  if((it||mine) && (TI_ACTIVE.includes(s)||s==="congelado")) out.push("comentario","cancelar");
  return [...new Set(out)];
}
function tiModeForm(c, mode){
  const id=c.id, busy=T.busy[id]?"disabled":"", today=todayISO();
  const fld=(k,label,type,extra)=>`<div class="field"><label for="tc-${h(id)}-${k}">${label}</label>${type==="area"
      ?`<textarea id="tc-${h(id)}-${k}" data-tc="${h(id)}" data-k="${k}" ${k==="comment"?'data-mention="1"':""} ${extra||""} ${busy}>${h(tiV(id,k))}</textarea>`
      :`<input type="${type}" id="tc-${h(id)}-${k}" data-tc="${h(id)}" data-k="${k}" ${k==="comment"?'data-mention="1"':""} value="${h(tiV(id,k))}" ${extra||""} ${busy}>`}${k==="comment"?MENTION_HINT:""}</div>`;
  let body="", go="Confirmar";
  if(mode==="previsao"){ body=fld("prazo","Previsão de entrega","date",`min="${today}"`)+fld("comment","Observação para o solicitante (opcional)","area"); go="Confirmar previsão"; }
  else if(mode==="falta"){ body=fld("pending","O que ainda falta","area",`placeholder="Liste o material pendente, um item por linha"`)
      +fld("prazo",c.prazo?"Prazo revisado (opcional, mantém o atual se ficar vazio)":"Prazo estimado (opcional)","date",`min="${today}"`)
      +(c.prazo?fld("comment","Motivo da mudança de prazo (se mudar)","text"):""); go="Pedir material"; }
  else if(mode==="revisar"){ body=fld("prazo","Novo prazo","date",`min="${today}"`)+fld("comment","Motivo da revisão","area"); go="Revisar prazo"; }
  else if(mode==="reuniao"){ body=(c.meeting_pref?`<p class="small muted" style="margin:0">Disponibilidade informada: ${h(c.meeting_pref)}</p>`:"")
      +fld("meeting_at","Data e hora da reunião","datetime-local")+fld("comment","Link ou local (opcional)","text"); go="Registrar reunião"; }
  else if(mode==="concluir"){ body=fld("comment","O que foi entregue (opcional)","area"); go="Concluir chamado"; }
  else if(mode==="congelar"){ body=`<p class="small muted" style="margin:0">O chamado sai da fila ativa e fica na aba Congelados, sem ser esquecido.</p>`
      +fld("comment","Por que não será priorizado agora","area")+fld("resume_on","Revisitar em (opcional)","date",`min="${today}"`); go="Congelar chamado"; }
  else if(mode==="descongelar"){ body=fld("comment","Observação (opcional)","text"); go="Retomar"; }
  else if(mode==="material"){ body=`<div class="notice" style="margin:0"><strong>Pendente:</strong><br>${tiPre(c.pending||"")}</div>`
      +fld("comment","O que você está enviando","area",`placeholder="Descreva o material e cole links, se houver"`)
      +`<div class="field"><label for="tfile-${h(id)}">Anexos (opcional)</label><input type="file" multiple id="tfile-${h(id)}" data-tfile="${h(id)}" accept="${TI_ACCEPT}" ${busy}><span class="hint">${tiFilesHint(id)}</span></div>`; go="Enviar para o TI"; }
  else if(mode==="comentario"){ body=fld("comment","Comentário","area"); go="Enviar comentário"; }
  else if(mode==="cancelar"){ body=fld("comment","Motivo do cancelamento","area"); go="Cancelar chamado"; }
  return `<div class="tiform">${body}
    <div class="btns"><button class="btn ${mode==="cancelar"?"bad":"primary"}" data-ta="do" data-id="${h(id)}" data-mode="${mode}" ${busy}>${T.busy[id]?"Salvando…":go}</button>
    <button class="btn" data-ta="mode" data-id="${h(id)}" data-mode="" ${busy}>Voltar</button></div></div>`;
}
function tiActionsHTML(c){
  const modes=tiModesFor(c); if(!modes.length) return "";
  const cur=T.mode[c.id];
  const inner = cur ? tiModeForm(c, cur)
    : `<p class="lbl" style="margin:0">${isTI()&&c.status==="aberto"?"Verificação do TI: os materiais estão completos?":"Ações"}</p>
       <div class="btns">${modes.map(m=>`<button class="btn ${TI_MODES[m].cls}" data-ta="mode" data-id="${h(c.id)}" data-mode="${m}">${h(TI_MODES[m].label(c))}</button>`).join("")}</div>`;
  return `<div class="actions">${inner}${stepsHTML(T.steps[c.id]||[])}</div>`;
}

async function tiDo(id, mode){
  const c=T.list.find(x=>x.id===id); if(!c) return;
  const v=k=>tiV(id,k).trim();
  const fail=(msg,k)=>{ T.steps[id]=[msg]; render(); const el=document.getElementById(`tc-${id}-${k}`); if(el) el.focus(); };
  const today=todayISO(), comment=v("comment");
  let upd={}, action="", entry={};
  if(mode==="previsao"){
    if(!v("prazo")) return fail("Informe a previsão de entrega.","prazo");
    if(v("prazo")<today) return fail("A previsão não pode estar no passado.","prazo");
    upd={status:"em_andamento", prazo:v("prazo")}; action="previsao";
  } else if(mode==="falta"){
    if(v("pending").length<3) return fail("Liste o que ainda falta.","pending");
    if(v("prazo") && v("prazo")<today) return fail("O prazo não pode estar no passado.","prazo");
    upd={status:"aguardando_material", pending:v("pending")}; if(v("prazo")) upd.prazo=v("prazo");
    action="falta_material"; entry.pending=v("pending");
  } else if(mode==="revisar"){
    if(!v("prazo")) return fail("Informe o novo prazo.","prazo");
    if(v("prazo")<today) return fail("O prazo não pode estar no passado.","prazo");
    if(v("prazo")===c.prazo) return fail("O novo prazo é igual ao atual.","prazo");
    if(comment.length<3) return fail("Explique o motivo da revisão.","comment");
    upd={prazo:v("prazo")}; action="prazo_revisado";
  } else if(mode==="reuniao"){
    if(!v("meeting_at")) return fail("Informe a data e a hora da reunião.","meeting_at");
    upd={meeting_at:new Date(v("meeting_at")).toISOString()}; action="reuniao"; entry.meeting_at=upd.meeting_at;
  } else if(mode==="concluir"){
    upd={status:"concluido"}; action="concluido";
  } else if(mode==="congelar"){
    if(comment.length<3) return fail("Explique por que o chamado não será priorizado agora.","comment");
    if(v("resume_on") && v("resume_on")<today) return fail("A data para revisitar não pode estar no passado.","resume_on");
    upd={status:"congelado", frozen_reason:comment, resume_on:v("resume_on")||null}; action="congelado";
  } else if(mode==="descongelar"){
    upd={status:TI_ACTIVE.includes(c.prev_status)?c.prev_status:"aberto"}; action="descongelado";
  } else if(mode==="material"){
    if(comment.length<3 && !(T.files[id]||[]).length) return fail("Descreva o que está enviando ou anexe um arquivo.","comment");
    upd={status:"aberto"}; action="material_enviado";
  } else if(mode==="comentario"){
    if(comment.length<2) return fail("Escreva o comentário.","comment");
    action="comentario";
  } else if(mode==="cancelar"){
    if(comment.length<3) return fail("Explique o motivo do cancelamento.","comment");
    upd={status:"cancelado"}; action="cancelado";
  }
  T.busy[id]=true; T.steps[id]=[]; render();
  const step=t=>{ T.steps[id].push(t); render(); };
  try{
    if(mode==="material"){
      const files=await tiUploadAll(id, c.id, step);
      if(files.length){ upd.attachments=[...(c.attachments||[]), ...files]; entry.files=files.length; }
    }
    step("Salvando…");
    if(upd.prazo && upd.prazo!==c.prazo) entry.prazo=upd.prazo;
    upd.history=[...(c.history||[]), withMentions({at:new Date().toISOString(), by_name:S.profile.full_name, action, comment, ...entry})];
    const { error } = await sb.from("chamados").update(upd).eq("id", id);
    if(error) throw error;
    T.inp[id]={}; T.mode[id]=""; T.steps[id]=[]; T.files[id]=[];
    S.flash={kind:"ok", text:`${c.code}: ${TI_ACTION[action]}.`};
    await loadChamados();
  }catch(e){
    T.steps[id]=[e instanceof Error && !e.code ? e.message : tiDbMessage(e)];
  }finally{ T.busy[id]=false; render(); }
}

function tiTabs(nav){
  const tabs=[["meus","Meus chamados",0]];
  if(isTI()){
    tabs.push(["fila","Fila do TI",T.list.filter(c=>c.status==="aberto").length]);
    tabs.push(["congelados","Congelados",T.list.filter(c=>c.status==="congelado").length]);
  }
  if(!tabs.some(t=>t[0]===T.tab)) T.tab="meus";
  nav.innerHTML = tabs.map(([k,l,n])=>`<button data-titab="${k}" ${T.tab===k?'aria-current="page"':""}>${h(l)}${n?`<span class="count">${n}</span>`:""}</button>`).join("");
}
function tiPrazoTxt(c){
  if(c.status==="concluido") return c.done_at?`Entregue ${fmtDateShort(c.done_at)}`:"Entregue";
  if(c.status==="cancelado") return "";
  return c.prazo ? `Prazo ${fmtDateShort(c.prazo)}` : "Sem prazo";
}
function tiRow(c){
  const open=T.openId===c.id, last=(c.history||[]).slice(-1)[0], flags=[];
  if(c.needs_meeting && !c.meeting_at && TI_ACTIVE.includes(c.status)) flags.push("Pediu reunião");
  if(c.meeting_at && TI_ACTIVE.includes(c.status) && isoLocal(new Date(c.meeting_at))>=todayISO()) flags.push(`Reunião ${fmtDateShort(isoLocal(new Date(c.meeting_at)))}`);
  if(tiLate(c)) flags.push("Atrasado");
  if(c.prazo_revisions && TI_ACTIVE.includes(c.status)) flags.push(c.prazo_revisions===1?"Prazo revisado":`Prazo revisado ${c.prazo_revisions}x`);
  if(c.status==="aberto" && last && last.action==="material_enviado") flags.push("Material recebido");
  if(c.status==="aguardando_material" && tiMine(c)) flags.push("Envie o material");
  if(tiReviewDue(c)) flags.push("Hora de revisitar");
  if(c.urgency==="Alta" && TI_ACTIVE.includes(c.status)) flags.push("Urgência alta");
  return `<div><button class="row" data-tiopen="${h(c.id)}" aria-expanded="${open}">
    <div class="stub"><span class="code">${h(c.code)}</span><span class="date">${h(fmtDateShort(c.created_at))}</span></div>
    <div class="rbody"><div class="desc">${h(c.title)}</div>
      <div class="meta"><span>${h(c.category)}</span>${T.tab!=="meus"?`<span>${h(c.requester_name)}</span>`:""}${flags.map(f=>`<span class="flag${f==="Atrasado"?" late":""}">${h(f)}</span>`).join("")}</div></div>
    <div class="rend"><span class="prz${tiLate(c)?" late":""}">${h(tiPrazoTxt(c))}</span><span class="badge t-${h(c.status)}">${h(TI_STATUS[c.status]||c.status)}</span></div>
  </button>${open?tiDetail(c):""}</div>`;
}
function tiDetail(c){
  const hist=(c.history||[]).map(e=>`<li><span class="when">${h(fmtWhen(e.at))}</span>, ${h(e.by_name||"Alguém")}: ${h(TI_ACTION[e.action]||e.action)}${e.prazo?`, prazo ${h(fmtDate(e.prazo))}`:""}${e.meeting_at?`, ${h(tiWhenMeeting(e.meeting_at))}`:""}${e.files?`, ${e.files} anexo${e.files>1?"s":""}`:""}${e.pending?`<span class="cmt">Pendente: ${h(e.pending)}</span>`:""}${e.comment?`<span class="cmt">“${fmtCmt(e.comment)}”</span>`:""}</li>`).join("");

  const meeting = !c.needs_meeting ? "Não foi pedida" : c.meeting_at ? `Agendada: ${tiWhenMeeting(c.meeting_at)}` : `Pedida${c.meeting_pref?`, disponibilidade: ${c.meeting_pref}`:", ainda não agendada"}`;

      <div class="full"><dt>Título</dt><dd>${h(c.title)}</dd></div>
      <div><dt>Código</dt><dd>${h(c.code)}</dd></div>
      <div><dt>Solicitante</dt><dd>${h(c.requester_name)}</dd></div>
      <div><dt>Tipo</dt><dd>${h(c.category)}</dd></div>
      <div><dt>Urgência</dt><dd>${h(c.urgency)}</dd></div>
      <div><dt>Data desejada</dt><dd>${c.desired_date?h(fmtDate(c.desired_date)):"Sem data"}</dd></div>
      <div><dt>Previsão de entrega</dt><dd>${h(prazo)}</dd></div>
      <div class="full"><dt>Reunião para explicar a demanda</dt><dd>${h(meeting)}</dd></div>
      ${c.status==="congelado"?`<div class="full"><dt>Congelado</dt><dd>Desde ${h(fmtDate(c.frozen_at))}, há ${tiDays(c.frozen_at,todayISO())} dia(s). ${c.resume_on?`Revisitar em ${h(fmtDate(c.resume_on))}.`:"Sem data para revisitar."}<br><span class="muted">Motivo: ${h(c.frozen_reason)}</span></dd></div>`:""}
    </dl>
    ${c.status==="aguardando_material"&&c.pending?`<div class="notice"><strong>Material pendente:</strong><br>${tiPre(c.pending)}</div>`:""}
    <h3 style="margin-top:0">Demanda</h3><div class="pre">${tiPre(c.description)}</div>
    ${c.materials||att?`<h3>Materiais e anexos</h3>${c.materials?`<div class="pre">${tiPre(c.materials)}</div>`:""}${att?`<ul class="att">${att}</ul>`:""}`:""}
    <h3>Histórico</h3><ol class="timeline">${hist}</ol>
    ${tiActionsHTML(c)}
  </section>`;
}
const tiList = (items, empty) => items.length ? `<div class="list">${items.map(tiRow).join("")}</div>` : `<div class="empty">${empty}</div>`;

function tiRenderView(v){

  if(T.tab==="meus") return tiRenderMine(v);
  if(T.tab==="fila") return tiRenderQueue(v);
  if(T.tab==="congelados") return tiRenderFrozen(v);

    ${mine.length?`<div class="totals"><div>Em aberto<strong>${mine.filter(c=>TI_ACTIVE.includes(c.status)).length}</strong></div><div>Congelados<strong>${mine.filter(c=>c.status==="congelado").length}</strong></div><div>Concluídos<strong>${mine.filter(c=>c.status==="concluido").length}</strong></div></div>`:""}

function tiRenderQueue(v){
  const novos=tiSortBy(T.list.filter(c=>c.status==="aberto"),"created_at");
  const andamento=tiSortBy(T.list.filter(c=>c.status==="em_andamento"),"prazo");
  const espera=tiSortBy(T.list.filter(c=>c.status==="aguardando_material"),"updated_at");
  const feitos=T.list.filter(c=>c.status==="concluido").slice(0,20);
  const late=andamento.filter(tiLate).length, due=T.list.filter(tiReviewDue).length;
  v.innerHTML=`<div class="bar"><h2>Fila do TI</h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-action="refresh">Atualizar</button><button class="btn" data-ta="sheet">Baixar planilha</button></div></div>
    ${due?`<div class="notice">${due===1?"1 chamado congelado chegou":`${due} chamados congelados chegaram`} na hora de revisitar. <button class="btn link" data-titab="congelados">Ver congelados</button></div>`:""}
    <div class="totals"><div>Para analisar<strong>${novos.length}</strong></div><div>Em andamento<strong>${andamento.length}</strong></div><div>Atrasados<strong${late?' style="color:var(--bad)"':""}>${late}</strong></div><div>Aguardando material<strong>${espera.length}</strong></div></div>
    <h3 style="margin-top:0">Para analisar</h3><p class="small muted" style="margin:-6px 0 10px">Verifique se tem todo o material. Se tiver, dê a previsão; se não, peça o que falta.</p>${tiList(novos,"Nenhum chamado novo.")}
    <h3>Em andamento, por prazo</h3>${tiList(andamento,"Nada em andamento.")}
    <h3>Aguardando material do solicitante</h3>${tiList(espera,"Nenhum chamado esperando material.")}
    ${feitos.length?`<h3>Concluídos recentemente</h3>${tiList(feitos,"")}`:""}`;
}
function tiRenderFrozen(v){
  const fz=T.list.filter(c=>c.status==="congelado").sort((a,b)=>(tiReviewDue(b)-tiReviewDue(a)) || String(a.resume_on||"9").localeCompare(String(b.resume_on||"9")) || String(a.frozen_at).localeCompare(String(b.frozen_at)));
  v.innerHTML=`<div class="bar"><h2>Congelados</h2></div>
    <p class="muted small" style="margin-top:0">Chamados que não serão priorizados agora, mas não podem ser esquecidos. Aparecem primeiro os que chegaram na data de revisitar ou estão congelados há 30 dias ou mais sem data.</p>
    ${tiList(fz,"Nenhum chamado congelado.")}`;
}
function tiProcessStatus(){
  if(!T.loaded) return "";
  const mine=T.list.filter(tiMine), parts=[];
  if(isTI()){
    const n=T.list.filter(c=>c.status==="aberto").length, late=T.list.filter(tiLate).length, due=T.list.filter(tiReviewDue).length;
    if(n) parts.push(`<span class="pill hot">${n} para analisar</span>`);
    if(late) parts.push(`<span class="pill warn">${late} ${late===1?"atrasado":"atrasados"}</span>`);
    if(due) parts.push(`<span class="pill warn">${due} congelado${due>1?"s":""} para revisitar</span>`);
  }
  const wait=mine.filter(c=>c.status==="aguardando_material").length, open=mine.filter(c=>c.status==="aberto"||c.status==="em_andamento").length;
  if(wait) parts.push(`<span class="pill warn">${wait} aguardando seu material</span>`);
  if(open) parts.push(`<span class="pill">${open} em andamento</span>`);
  return parts.join("");
}

/* ---------- planilha ---------- */
function tiDownloadSheet(){
  const rows=tiSortBy(T.list,"created_at").map(c=>({
    "Código":c.code, "Título":c.title, "Tipo":c.category, "Urgência":c.urgency, "Solicitante":c.requester_name, "E-mail":c.requester_email,
    "Status":TI_STATUS[c.status]||c.status, "Aberto em":fmtDate(c.created_at), "Data desejada":fmtDate(c.desired_date),
    "Previsão de entrega":fmtDate(c.prazo), "Prazo original":fmtDate(c.prazo_original), "Revisões de prazo":c.prazo_revisions||0,
    "Atrasado":tiLate(c)?"Sim":"", "Pediu reunião":c.needs_meeting?"Sim":"Não", "Reunião":c.meeting_at?tiWhenMeeting(c.meeting_at):"",
    "Material pendente":c.status==="aguardando_material"?(c.pending||""):"", "Congelado em":c.status==="congelado"?fmtDate(c.frozen_at):"",
    "Motivo do congelamento":c.frozen_reason||"", "Revisitar em":fmtDate(c.resume_on), "Concluído em":fmtDate(c.done_at), "Descrição":c.description
  }));
  const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{"Código":""}]);
  ws["!cols"]=[16,34,22,10,22,28,20,12,12,14,14,10,10,10,22,40,12,36,12,12,60].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Chamados");
  XLSX.writeFile(wb, `Chamados de TI ${todayISO()}.xlsx`);
}

/* ---------- eventos do processo ---------- */
function tiClick(t){
  if(t.dataset.titab){ T.tab=t.dataset.titab; T.openId=null; render(); return true; }
  if(t.dataset.tiopen){ T.openId = T.openId===t.dataset.tiopen ? null : t.dataset.tiopen; render(); return true; }
  if(t.dataset.tifile){ tiOpenFile(t.dataset.tifile); return true; }
  const a=t.dataset.ta; if(!a) return false;
  if(a==="new"){ T.showForm=true; T.form={urgency:"Média"}; T.formErr={}; T.files.new=[]; render(); const el=$("#tf-title"); if(el) el.focus(); }
  else if(a==="cancel"){ T.showForm=false; T.form={}; T.formErr={}; T.files.new=[]; render(); }
  else if(a==="mode"){
    const id=t.dataset.id, m=t.dataset.mode, c=T.list.find(x=>x.id===id);
    T.mode[id]=m; T.steps[id]=[]; T.inp[id]={};
    if(c && (m==="revisar"||m==="previsao") && c.prazo && c.prazo>=todayISO()) T.inp[id].prazo=c.prazo;
    if(c && m==="falta" && c.status==="aguardando_material") T.inp[id].pending=c.pending||"";
    if(c && m==="reuniao" && c.meeting_at) T.inp[id].meeting_at=tiLocalDT(c.meeting_at);
    render(); const first=document.getElementById(`tc-${id}-${{previsao:"prazo",falta:"pending",revisar:"prazo",reuniao:"meeting_at"}[m]||"comment"}`); if(first) first.focus();
  }
  else if(a==="do"){ tiDo(t.dataset.id, t.dataset.mode); }
  else if(a==="sheet"){ try{ tiDownloadSheet(); }catch(e){ S.flash={kind:"warn", text:"Não foi possível gerar a planilha."}; render(); } }
  return true;
}
function tiInput(t){
  if(t.dataset.tf){ T.form[t.dataset.tf]=t.value;
    if(T.formErr[t.dataset.tf]){ delete T.formErr[t.dataset.tf]; const e=document.getElementById("ti-err-"+t.dataset.tf); if(e) e.remove(); }
    if(t.dataset.tf==="needs_meeting"){ tiRenderForm(); if(t.value==="sim"){ const x=$("#tf-mp"); if(x) x.focus(); } }
    return true; }
  if(t.dataset.tc){ const id=t.dataset.tc; T.inp[id]=T.inp[id]||{}; T.inp[id][t.dataset.k]=t.value; return true; }
  return false;
}
function tiChange(t){
  if(t.dataset.tfile==null) return false;
  const key=t.dataset.tfile; T.files[key]=Array.from(t.files||[]);
  if(key==="new") T.form.uploaded=null;
  const hint=t.parentElement && t.parentElement.querySelector(".hint"); if(hint) hint.innerHTML=tiFilesHint(key);
  return true;
}

/* ---------- eventos ---------- */
document.addEventListener("click", async ev=>{
  if(N.open && !ev.target.closest("#notif,#bell")){ N.open=false; renderNotif(); }
  const t=ev.target.closest("button,a"); if(!t) return;
  if(t.dataset.mpick!=null){ mentionPick(Number(t.dataset.mpick)); return; }
  if(t.dataset.notif){ openNotif(t.dataset.notif); return; }
  if(t.dataset.action==="bell"){ N.open=!N.open; renderNotif(); if(N.open) loadNotifs().then(renderNotif); return; }
  if(t.dataset.action==="notif-all"){ const now=new Date().toISOString(); N.list.forEach(n=>{ if(!n.read_at) n.read_at=now; }); renderNotif(); await sb.from("notifications").update({read_at:now}).is("read_at",null).eq("user_id",myId()); return; }
  if(t.dataset.rcask){ RC.open[t.dataset.rcask]=true; S.steps[t.dataset.rcask]=[]; render(); const x=document.getElementById("rc-"+t.dataset.rcask); if(x) x.focus(); return; }
  if(t.dataset.rcno){ RC.open[t.dataset.rcno]=false; S.steps[t.dataset.rcno]=[]; render(); return; }
  if(t.dataset.auth){ S.authMode=t.dataset.auth; S.authErr=null; S.authMsg=null; renderAuth(); const f=document.querySelector("#auth-form input"); if(f) f.focus(); return; }
  if(t.dataset.go){ closeMenu(); go(t.dataset.go); return; }
  if(t.dataset.nav){
    closeMenu();
    const [mod,tab]=t.dataset.nav.split(":");
    if(mod==="reembolsos" && tab){ if(S.module!=="reembolsos"){ S.tab=tab; go("reembolsos"); } else { S.tab=tab; S.openId=null; S.draft=null; render(); window.scrollTo({top:0}); } }
    else if(mod==="rh" && tab && typeof RH!=="undefined"){ RH.tab=tab; if(S.module!=="rh") go("rh"); else { render(); window.scrollTo({top:0}); } }
    else if(mod==="ti" && tab){ if(S.module!=="ti"){ T.tab=tab; go("ti"); } else { T.tab=tab; T.openId=null; render(); window.scrollTo({top:0}); } }
    else go(mod);
    return;
  }
  if(S.module==="ti" && tiClick(t)) return;
  if(S.module==="rh" && typeof RH!=="undefined" && RH.click(t)) return;
  if(t.dataset.urh){
    const id=t.dataset.urh; S.busy["u"+id]=true; render();
    const { error } = await sb.from("profiles").update({rh:t.dataset.val==="1"}).eq("id",id);
    S.flash = error ? {kind:"warn", text:dbMessage(error)} : {kind:"ok", text: t.dataset.val==="1" ? "Pessoa incluída no RH." : "Pessoa retirada do RH."};
    await loadUsers(); S.busy["u"+id]=false; render(); return;
  }
  if(t.dataset.uti){
    const id=t.dataset.uti; S.busy["u"+id]=true; render();
    const { error } = await sb.from("profiles").update({ti:t.dataset.val==="1"}).eq("id",id);
    S.flash = error ? {kind:"warn", text:dbMessage(error)} : {kind:"ok", text: t.dataset.val==="1" ? "Pessoa incluída na equipe de TI." : "Pessoa retirada da equipe de TI."};
    await loadUsers(); S.busy["u"+id]=false; render(); return;
  }
  if(t.dataset.tab){ S.tab=t.dataset.tab; S.openId=null; S.draft=null; render(); return; }
  if(t.dataset.open){ S.openId = S.openId===t.dataset.open ? null : t.dataset.open; render(); return; }
  if(t.dataset.receipt){ openReceipt(t.dataset.receipt); return; }
  if(t.dataset.act){ act(t.dataset.id, t.dataset.act); return; }
  if(t.dataset.cancelask){ CANCEL.open[t.dataset.cancelask]=true; S.steps[t.dataset.cancelask]=[]; render(); const x=document.getElementById("ccmt-"+t.dataset.cancelask); if(x) x.focus(); return; }
  if(t.dataset.cancelno){ CANCEL.open[t.dataset.cancelno]=false; S.steps[t.dataset.cancelno]=[]; render(); return; }
  if(t.dataset.ustatus){
    const id=t.dataset.uid; S.busy["u"+id]=true; render();
    const { error } = await sb.from("profiles").update({status:t.dataset.ustatus}).eq("id",id);
    S.flash = error ? {kind:"warn", text:dbMessage(error)} : {kind:"ok", text: t.dataset.ustatus==="aprovado" ? "Acesso liberado. A pessoa já pode entrar." : "Acesso bloqueado."};
    await loadUsers(); S.busy["u"+id]=false; render(); return;
  }
  if(t.dataset.edit){
    const r=S.requests.find(x=>x.id===t.dataset.edit); if(!r) return;
    S.editId=r.id; S.showForm=true; S.formErr={};
    S.form={title:r.title, cost_center:r.cost_center, partner:r.partner, on_behalf:r.on_behalf?"sim":"nao", on_behalf_of:r.on_behalf_of||"", pix:r.pix,
      items:(r.items||[]).map(it=>({date:it.date, category:it.category, amount:String(it.amount).replace(".",","), km:it.km?String(it.km).replace(".",","):"", description:it.description,
        receipt_path:it.receipt_path, receipt_name:it.receipt_name, receipt_type:it.receipt_type, file:null}))};
    S.tab="minhas"; S.module="reembolsos"; $("#view").innerHTML=""; render(); window.scrollTo({top:0}); return;
  }
  if(t.dataset.rm!=null){ S.form.items.splice(Number(t.dataset.rm),1); S.formErr={}; renderForm(); return; }
  const a=t.dataset.action; if(!a) return;
  if(a==="menu"){ $("#side").classList.contains("open") ? closeMenu() : openMenu(); return; }
  if(a==="menu-close"){ closeMenu(); return; }
  if(a==="dismiss"){ S.flash=null; render(); }
  else if(a==="logout"){ await sb.auth.signOut(); }
  else if(a==="recheck"){ await loadAll(); }
  else if(a==="refresh"){ await refresh(); }
  else if(a==="new"){ S.showForm=true; S.editId=null; S.form={items:[{date:todayISO()}]}; S.formErr={}; render(); const d=$("#f-title"); if(d) d.focus(); }
  else if(a==="cancel"){ S.showForm=false; S.editId=null; S.form={}; S.formErr={}; render(); }
  else if(a==="add-item"){ const last=(S.form.items||[]).slice(-1)[0]; S.form.items=[...(S.form.items||[]), {date:(last&&last.date)||todayISO()}]; delete S.formErr.items; renderForm();
    const n=S.form.items.length-1, el=document.getElementById(`i${n}_category`); if(el){ el.focus(); el.scrollIntoView({block:"center"}); } }
  else if(a==="download-sheet"){ try{ downloadSheet(); }catch(e){ S.flash={kind:"warn", text:"Não foi possível gerar a planilha."}; render(); } }
  else if(a==="save-config"){
    const d=S.draft, limits={};
    for(const [k,val] of Object.entries(d.limits)){ const n=parseMoney(val); if(n>0) limits[k]=n; }
    const kr=parseMoney(d.km_rate);
    S.busy.config=true; S.steps.config=[]; render();
    const { error } = await sb.from("settings").update({ km_rate: kr>0?kr:KM_RATE_DEFAULT, limits }).eq("id",1);
    if(error) S.steps.config=[dbMessage(error)]; else { await loadSettings(); S.draft=null; S.flash={kind:"ok", text:"Política salva."}; }
    S.busy.config=false; render();
  }
});
document.addEventListener("input", ev=>{
  const t=ev.target;
  if(t.dataset && t.dataset.mention) mentionCheck(t);
  if(t.dataset.a){ S.auth[t.dataset.a]=t.value; return; }
  if(tiInput(t)) return;
  if(S.module==="rh" && typeof RH!=="undefined" && RH.input(t)) return;
  if(t.dataset.f){ S.form[t.dataset.f]=t.value; if(S.formErr[t.dataset.f]){ delete S.formErr[t.dataset.f]; const e=document.getElementById("err-"+t.dataset.f); if(e) e.remove(); }
    if(t.dataset.f==="on_behalf"){ renderForm(); if(t.value==="sim"){ const x=$("#f-for"); if(x) x.focus(); } } return; }
  if(t.dataset.it!=null){ const i=Number(t.dataset.it), k=t.dataset.k; S.form.items[i][k]=t.value;
    const ek=`i${i}_${k}`; if(S.formErr[ek]){ delete S.formErr[ek]; const e=document.getElementById("err-"+ek); if(e) e.remove(); }
    if(k==="amount"||k==="km"){ const tot=document.getElementById("f-total"); if(tot) tot.textContent=brl(formTotal()); }
    if(k==="km"){ const kv=document.getElementById(`i${i}_kmval`); if(kv) kv.textContent=kmHint(S.form.items[i]); }
    return; }
  if(t.dataset.cmt){ S.comment[t.dataset.cmt]=t.value; return; }
  if(t.dataset.ccmt){ CANCEL.cmt[t.dataset.ccmt]=t.value; return; }
  if(t.dataset.rc){ RC.cmt[t.dataset.rc]=t.value; return; }
  if(t.dataset.pay){ S.payDate[t.dataset.pay]=t.value; return; }
  if(t.dataset.lim!=null){ S.draft.limits[t.dataset.lim]=t.value; return; }
  if(t.dataset.kmrate!=null){ S.draft.km_rate=t.value; return; }
});
document.addEventListener("change", async ev=>{
  const t=ev.target;
  if(tiChange(t)) return;
  if(S.module==="rh" && typeof RH!=="undefined" && RH.change(t)) return;
  if(t.dataset.itfile!=null){ const i=Number(t.dataset.itfile); S.form.items[i].file=t.files&&t.files[0]||null; delete S.formErr[`i${i}_receipt`]; renderForm(); }
  if(t.dataset.it!=null && (t.dataset.k==="category"||t.dataset.k==="amount")) renderForm();
  if(t.dataset.role){
    const id=t.dataset.role; S.busy["u"+id]=true; render();
    const { error } = await sb.from("profiles").update({role:t.value}).eq("id",id);
    S.flash = error ? {kind:"warn", text:dbMessage(error)} : {kind:"ok", text:"Perfil atualizado."};
    await loadUsers(); S.busy["u"+id]=false; render();
  }
});
document.addEventListener("keydown", ev=>{
  if(MP.el && ev.target===MP.field){
    if(ev.key==="ArrowDown"){ ev.preventDefault(); MP.idx=(MP.idx+1)%MP.items.length; mentionCheck(MP.field); return; }
    if(ev.key==="ArrowUp"){ ev.preventDefault(); MP.idx=(MP.idx-1+MP.items.length)%MP.items.length; mentionCheck(MP.field); return; }
    if(ev.key==="Enter"||ev.key==="Tab"){ ev.preventDefault(); mentionPick(MP.idx); return; }
    if(ev.key==="Escape"){ ev.preventDefault(); mentionClose(); return; }
  }
  if(ev.key==="Escape"){ closeMenu(); if(N.open){ N.open=false; renderNotif(); } }
});
document.addEventListener("focusout", ev=>{ if(MP.el && ev.target===MP.field) setTimeout(()=>{ if(document.activeElement!==MP.field) mentionClose(); },150); });
window.addEventListener("resize", mentionClose);
document.addEventListener("submit", ev=>{
  ev.preventDefault();
  if(ev.target.id==="auth-form"){ if(!S.authBusy) authSubmit(); }
  else if(ev.target.id==="req-form"){ if(!S.formBusy) submitForm(); }
  else if(ev.target.id==="ti-form"){ if(!T.formBusy) tiSubmit(); }
  else if(typeof RH!=="undefined") RH.submit(ev.target);
});

/* ---------- inicialização ---------- */
(async function init(){
  if(!CONFIGURED){ render(); return; }
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==="INITIAL_SESSION") return;
    if(event==="PASSWORD_RECOVERY"){ S.session=session; S.authMode="recovery"; S.auth={}; render(); return; }
    const had=!!S.session; S.session=session;
    if(!session){ if(location.hash) history.replaceState(null,"",location.pathname+location.search); Object.assign(S,{profile:null, requests:[], users:[], reqLoaded:false, module:"home", tab:"minhas", showForm:false, editId:null, form:{}, authMode:"login"});
      Object.assign(T,{list:[], loaded:false, loadErr:null, tab:"meus", openId:null, showForm:false, form:{}, formErr:{}, inp:{}, mode:{}, files:{}}); render(); }
    else if(!had || event==="SIGNED_IN" && !S.profile){ setTimeout(loadAll,0); }
  });
  routeFromHash();
  const { data } = await sb.auth.getSession();
  S.session=data.session;
  if(S.session && S.authMode!=="recovery") await loadAll(); else render();
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") refresh(); });
  setInterval(()=>{ if(document.visibilityState==="visible" && !S.formBusy && !S.showForm && !T.showForm && !Object.values(T.mode).some(Boolean)) refresh(); }, 60000);
})();
