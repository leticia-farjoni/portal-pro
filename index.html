<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal de Processos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F7; --sheet:#FFFFFF; --ink:#18202B; --ink-2:#4A5563; --ink-3:#6B7684; --rule:#D6DCE4;
  --carbon:#2F45B5; --carbon-ink:#FFFFFF; --carbon-soft:#E6EAFA;
  --ok:#1F7A4D; --ok-soft:#E2F2E9; --bad:#B42318; --bad-soft:#FBE8E6; --warn:#8F5400; --warn-soft:#FBEFD9;
  --focus:#2F45B5;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10151C; --sheet:#19202A; --ink:#E6EBF1; --ink-2:#A6B0BD; --ink-3:#8692A0; --rule:#2B3441;
    --carbon:#93A3FF; --carbon-ink:#0E1430; --carbon-soft:#222B4C;
    --ok:#62C99B; --ok-soft:#163126; --bad:#FF8B7B; --bad-soft:#3A1C19; --warn:#F1B252; --warn-soft:#382A12;
    --focus:#93A3FF; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10151C; --sheet:#19202A; --ink:#E6EBF1; --ink-2:#A6B0BD; --ink-3:#8692A0; --rule:#2B3441;
  --carbon:#93A3FF; --carbon-ink:#0E1430; --carbon-soft:#222B4C;
  --ok:#62C99B; --ok-soft:#163126; --bad:#FF8B7B; --bad-soft:#3A1C19; --warn:#F1B252; --warn-soft:#382A12;
  --focus:#93A3FF; color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px 64px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:28px 0 18px;border-bottom:2px solid var(--ink)}
.brand{font-weight:700;font-size:28px;letter-spacing:-0.02em;line-height:1}
.brand small{display:block;font-weight:400;font-size:14px;color:var(--ink-2);letter-spacing:0;margin-top:6px}
.who{font-size:14px;color:var(--ink-2);text-align:right}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:12px 0 0;margin-bottom:24px;border-bottom:1px solid var(--rule)}
nav.tabs button{background:none;border:0;padding:10px 14px;font-size:15px;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:600;border-bottom-color:var(--carbon)}
nav.tabs .count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--carbon);color:var(--carbon-ink);font-size:12px;font-weight:600;text-align:center;line-height:20px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px;flex-wrap:wrap}
h2{font-size:20px;font-weight:600;margin:0;letter-spacing:-0.01em}
h3{font-size:16px;font-weight:600;margin:28px 0 10px}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;border:1px solid var(--rule);background:var(--sheet);padding:9px 16px;font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--carbon);border-color:var(--carbon);color:var(--carbon-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.btn.link{border:0;background:none;padding:0;color:var(--carbon);text-decoration:underline;text-underline-offset:3px}
.notice{border:1px solid var(--rule);border-left:4px solid var(--warn);background:var(--sheet);padding:12px 16px;margin:0 0 16px;font-size:15px}
.notice.err{border-left-color:var(--bad)}
.notice.ok{border-left-color:var(--ok)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2);border:1px dashed var(--rule);background:var(--sheet)}

/* Canhoto */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:118px 1fr auto;align-items:stretch;width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:0;text-align:left;cursor:pointer;position:relative}
.row:hover{border-color:var(--ink-3)}
.row[aria-expanded="true"]{border-color:var(--ink);border-bottom-left-radius:0;border-bottom-right-radius:0}
.stub{padding:14px 14px;border-right:2px dashed var(--rule);position:relative;display:flex;flex-direction:column;justify-content:center;gap:2px}
.stub::before,.stub::after{content:"";position:absolute;right:-8px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:1px solid var(--rule)}
.stub::before{top:-8px}.stub::after{bottom:-8px}
.code{font-weight:600;font-size:13px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.date{font-size:13px;color:var(--ink-2)}
.rbody{padding:14px 16px;min-width:0}
.desc{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:14px;color:var(--ink-2);display:flex;gap:14px;flex-wrap:wrap;margin-top:2px}
.rend{padding:14px 16px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:6px}
.amt{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.s-aguardando_gestor,.s-aguardando_financeiro{color:var(--carbon)}
.s-aprovado{color:var(--ok)}
.s-pago{color:var(--ok);background:var(--ok-soft)}
.s-devolvido{color:var(--warn)}
.s-recusado{color:var(--bad)}
.flag{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:1px 6px;border-radius:3px}

/* Detalhe */
.detail{background:var(--sheet);border:1px solid var(--ink);border-top:0;margin-top:-10px;padding:22px 22px 24px;position:relative;overflow:hidden}
.stamp{position:absolute;top:18px;right:22px;transform:rotate(-7deg);border:3px double currentColor;border-radius:6px;padding:6px 14px;font-weight:700;font-size:20px;letter-spacing:.04em;opacity:.9;pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px 24px;margin:0 0 18px;padding-right:180px}
.grid dt{font-size:13px;color:var(--ink-2)}
.grid dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.full{grid-column:1/-1}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--rule)}
.timeline li{padding:0 0 12px 16px;position:relative;font-size:14px}
.timeline li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--sheet);border:2px solid var(--ink-3)}
.timeline .when{color:var(--ink-2)}
.timeline .cmt{display:block;margin-top:2px;color:var(--ink);font-style:italic}
.actions{margin-top:18px;padding-top:18px;border-top:1px solid var(--rule)}
.actions .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.progress{font-size:14px;color:var(--ink-2);margin-top:10px}

/* Formulário */
form.sheet,.panel{background:var(--sheet);border:1px solid var(--rule);border-top:4px solid var(--carbon);padding:22px;margin-bottom:24px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.wide{grid-column:1/-1}
label{font-size:14px;font-weight:500}
.hint{font-size:13px;color:var(--ink-2)}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:9px 11px;font-size:15px}
textarea{min-height:76px;resize:vertical}
input[type=file]{font-size:14px}
.err{font-size:13px;color:var(--bad)}
.picker{position:relative}
.pres{border:1px solid var(--rule);background:var(--sheet);border-radius:4px;margin-top:4px;max-height:220px;overflow:auto}
.pres button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 11px;cursor:pointer;font-size:14px}
.pres button:hover,.pres button:focus-visible{background:var(--carbon-soft)}
.pres .em{color:var(--ink-2);font-size:13px}
.radios{display:flex;gap:22px;padding:8px 0}
.radios label{font-weight:400;display:flex;gap:8px;align-items:center;cursor:pointer}
.lbl{font-size:14px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--carbon-soft);border-radius:4px;padding:4px 6px 4px 10px;font-size:14px}
.chip button{border:0;background:none;cursor:pointer;color:var(--ink-2);font-size:16px;line-height:1;padding:0 4px}
.formfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
fieldset.item{border:1px solid var(--rule);border-left:3px solid var(--carbon);border-radius:4px;padding:14px 16px 16px;margin:0 0 12px;position:relative;min-width:0}
fieldset.item legend{font-weight:600;font-size:14px;padding:0 6px}
fieldset.item .rm{position:absolute;top:10px;right:14px;font-size:14px}
.deadline{margin:-6px 0 16px;font-size:14px;color:var(--ink-2);border-left:3px solid var(--warn);padding:2px 0 2px 10px}
.totalbar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:18px;padding:14px 0 0;border-top:2px solid var(--ink)}
.totalbar strong{font-size:26px;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;margin:0 0 6px}
table.items{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
table.items th{text-align:left;font-weight:500;color:var(--ink-2);border-bottom:1px solid var(--rule);padding:6px 8px}
table.items td{border-bottom:1px solid var(--rule);padding:8px;vertical-align:top}
table.items .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.items .n{width:28px;color:var(--ink-2)}
table.items tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
.totals{display:flex;gap:28px;flex-wrap:wrap;margin:0 0 18px}
.totals div{font-size:14px;color:var(--ink-2)}
.totals strong{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.folderopt{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.folderopt .path{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.limits{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:640px){
  .row{grid-template-columns:1fr auto}
  .stub{display:none}
  .fields{grid-template-columns:1fr}
  .grid{padding-right:0;padding-top:46px}
  .stamp{font-size:16px}
  header.top{flex-direction:column;align-items:flex-start}
  .who{text-align:left}
}
@media (prefers-reduced-motion: no-preference){
  .stamp{animation:thud .28s ease-out}
  @keyframes thud{from{transform:rotate(-7deg) scale(1.35);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:.9}}
}

.authwrap{max-width:460px;margin:24px auto 0}
.fields.one{grid-template-columns:1fr}
.authlinks{display:flex;gap:18px;flex-wrap:wrap}
.panel.tight{padding:4px 18px;border-top-width:1px}
.userrow{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule)}
.userrow:last-child{border-bottom:0}
.uact{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.uact select{width:auto}
.u-pendente{color:var(--warn)}.u-aprovado{color:var(--ok)}.u-bloqueado{color:var(--bad)}
code{background:var(--paper);padding:1px 5px;border-radius:3px;font-size:14px}
@media (max-width:640px){.userrow{grid-template-columns:1fr}.uact{justify-content:flex-start}}

.crumb{background:none;border:0;padding:12px 0 0;color:var(--carbon);font-size:14px;font-weight:500;cursor:pointer}
.crumb:hover{text-decoration:underline;text-underline-offset:3px}
.hello{margin:8px 0 22px}
.hello h2{font-size:26px}
.hello p{margin:4px 0 0}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.proc{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-top:4px solid var(--carbon);border-radius:4px;padding:22px;min-height:230px;cursor:pointer;color:var(--ink);transition:border-color .15s, transform .15s}
.proc:hover{border-color:var(--ink);border-top-color:var(--carbon)}
.proc.small{min-height:0;border-top-color:var(--ink-3)}
.proc .ico{width:44px;height:44px;color:var(--carbon)}
.proc .ico svg{width:100%;height:100%}
.ptitle{font-size:19px;font-weight:700;letter-spacing:-0.01em}
.pdesc{font-size:15px;color:var(--ink-2)}
.pstatus{display:flex;flex-wrap:wrap;gap:6px}
.pstatus:empty{display:none}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--carbon-soft);color:var(--carbon)}
.pill.hot{background:var(--carbon);color:var(--carbon-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pgo{margin-top:auto;font-weight:600;color:var(--carbon);font-size:15px}
.admin-h{margin-top:36px}

/* Chamados de TI */
:root{--ice:#1C6E8C;--ice-soft:#E0F1F7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ice:#7CCBE6;--ice-soft:#13303B}}
:root[data-theme="dark"]{--ice:#7CCBE6;--ice-soft:#13303B}
.t-aberto{color:var(--carbon)}
.t-aguardando_material{color:var(--warn)}
.t-em_andamento{color:var(--ok)}
.t-concluido{color:var(--ok);background:var(--ok-soft)}
.t-cancelado{color:var(--bad)}
.t-congelado{color:var(--ice);background:var(--ice-soft)}
.stamp.t-concluido,.stamp.t-congelado{background:none}
.prz{font-weight:600;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.prz.late,.flag.late{color:var(--bad)}
.flag.late{background:var(--bad-soft)}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:12px 14px}
ul.att{margin:10px 0 0;padding-left:20px;font-size:14px}
.tiform{display:flex;flex-direction:column;gap:12px;max-width:560px}
input[type=datetime-local]{width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:9px 11px;font-size:15px}
.pill.ti{background:var(--ice-soft);color:var(--ice)}
@media (prefers-reduced-motion: no-preference){.proc:hover{transform:translateY(-2px)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand" id="brand"></div>
    <div class="who" id="who"></div>
  </header>
  <div id="crumb"></div>
  <nav class="tabs" id="tabs" aria-label="Seções" hidden></nav>
  <div id="banner"></div>
  <main id="view"><div class="empty">Carregando…</div></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
/* =====================================================================
   CONFIGURAÇÃO — cole aqui os dados do seu projeto Supabase
   (Project Settings → API → Project URL e a chave "anon public")
   ===================================================================== */
const SUPABASE_URL = "https://wolbdazxefiqcvjzzhhq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvbGJkYXp4ZWZpcWN2anp6aGhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1Nzc0NTYsImV4cCI6MjEwODE1MzQ1Nn0.3yC6BURjxZoCh22Uu15BpUD9M00JmUbBvmeUwvFd2wk";
/* ===================================================================== */

const CATEGORIES = ["Alimentação","Estacionamento","Hospedagem","Km","Pedágio","Uber","Outros"];
const COST_CENTERS = ["Especialistas","PRÓ Gestão","Reunião da Rede","Expo Grandes Marcas","Prospecção","Relacionamento","Outros","Negociação com Fornecedores"];
const KM_RATE_DEFAULT = 1.10;
const BUCKET = "comprovantes";
const STATUS = {
  aguardando_financeiro:"Com o financeiro",
  aprovado:"Aprovado, a pagar",
  pago:"Pago",
  devolvido:"Devolvido para ajuste",
  recusado:"Recusado"
};
const ACTION_LABEL = {
  enviado:"Enviou a solicitação", reenviado:"Reenviou com ajustes",
  aprovado:"Aprovou", devolvido:"Devolveu para ajuste", recusado:"Recusou", pago:"Registrou o pagamento"
};
const ROLE_LABEL = { colaborador:"Colaborador", financeiro:"Financeiro", admin:"Administrador" };
const USER_STATUS = { pendente:"Aguardando aprovação", aprovado:"Aprovado", bloqueado:"Bloqueado" };

/* ---------- Portal: nome e processos disponíveis ----------
   Para incluir um processo novo, acrescente um item em PROCESSES
   e crie a tela correspondente em renderView(). */
const PORTAL_NAME = "Portal de Processos";
const PORTAL_TAGLINE = "Processos internos da empresa em um só lugar";
const PROCESSES = [
  { id:"reembolsos", title:"Reembolso de despesas",
    desc:"Solicite o reembolso de despesas de trabalho, anexe os comprovantes e acompanhe a análise do financeiro.",
    icon:'<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M10 4h20v32l-3.3-2.5L23.3 36 20 33.5 16.7 36l-3.4-2.5L10 36z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M15 12h10M15 17h10M15 22h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>' },
  { id:"ti", title:"Chamados de TI",
    desc:"Peça demandas à equipe de TI, envie os materiais necessários e acompanhe a previsão de entrega.",
    icon:'<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="7" width="30" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M14 33h12M20 27v6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M15 14l-3 3 3 3M25 14l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' }
];
const ROUTES = ["home","reembolsos","ti","usuarios"];

const CONFIGURED = /^https:\/\//.test(SUPABASE_URL) && SUPABASE_ANON_KEY.length > 30;
const sb = CONFIGURED ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const S = {
  session:null, profile:null, profileErr:null, settings:{km_rate:KM_RATE_DEFAULT, limits:{}},
  requests:[], reqLoaded:false, users:[], loadErr:null,
  module:"home", tab:"minhas", openId:null, showForm:false, editId:null,
  form:{}, formErr:{}, formBusy:false, formSteps:[],
  comment:{}, payDate:{}, busy:{}, steps:{}, draft:null, flash:null,
  authMode:"login", auth:{}, authErr:null, authMsg:null, authBusy:false
};

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const h = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = n => (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function isoLocal(d){ const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
const todayISO = () => isoLocal(new Date());
const fmtDate = iso => { if(!iso) return ""; const [y,m,d]=String(iso).slice(0,10).split("-"); return `${d}/${m}/${y}`; };
const fmtDateShort = iso => { if(!iso) return ""; const d=new Date(String(iso).length===10?iso+"T12:00:00":iso); return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}).replace(".",""); };
const fmtWhen = iso => new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
function parseMoney(s){
  s = String(s??"").replace(/R\$|\s/g,"");
  if(!s) return NaN;
  if(s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  else if(/\.\d{3}($|\.)/.test(s)) s = s.replace(/\./g,"");
  return Math.round(parseFloat(s)*100)/100;
}

function dbMessage(e){
  const m = (e && (e.message||e.error_description||e.msg)) || "";
  if(/row-level security|permission denied/i.test(m)) return "Você não tem permissão para esta ação.";
  if(/Failed to fetch|NetworkError/i.test(m)) return "Sem conexão com o servidor. Verifique a internet e tente de novo.";
  return m || "Algo deu errado. Tente de novo.";
}

/* ---------- prazo: dia 5 do mês seguinte ---------- */
function deadlineFor(ym){ const [y,m]=ym.split("-").map(Number); return isoLocal(new Date(y,m,5,12)); }
function monthOpen(dateISO, refISO){ return refISO <= deadlineFor(dateISO.slice(0,7)); }
function monthName(iso){ return new Date(iso.slice(0,7)+"-15T12:00:00").toLocaleDateString("pt-BR",{month:"long",year:"numeric"}); }
function oldestOpenDate(refISO){
  const d=new Date(refISO+"T12:00:00"); const prev=isoLocal(new Date(d.getFullYear(), d.getMonth()-1, 1, 12));
  return monthOpen(prev, refISO) ? prev : refISO.slice(0,8)+"01";
}
function deadlineHint(refISO){
  const min=oldestOpenDate(refISO), cur=refISO.slice(0,7);
  const curTxt=`despesas de ${monthName(refISO)} até ${fmtDate(deadlineFor(cur))}`;
  if(min.slice(0,7)!==cur) return `Prazo: despesas de ${monthName(min)} podem ser enviadas até ${fmtDate(deadlineFor(min.slice(0,7)))}, e ${curTxt}.`;
  return `Prazo: ${curTxt}. Despesas de meses anteriores já não podem ser enviadas.`;
}

const limitOf = cat => Number((S.settings.limits||{})[cat])||0;
function itemValue(it){
  if(it.category==="Km"){ const km=parseMoney(it.km); return km>0 ? Math.round(km*kmRate()*100)/100 : 0; }
  const v=parseMoney(it.amount); return v>0 ? v : 0;

const formTotal = () => Math.round((S.form.items||[]).reduce((s,it)=>s+itemValue(it),0)*100)/100;
function dateRange(r){

  return ds[0]===ds[ds.length-1] ? fmtDate(ds[0]) : `${fmtDate(ds[0])} a ${fmtDate(ds[ds.length-1])}`;
}

/* ---------- comprovantes ---------- */
async function shrinkImage(file, target){
  let bmp;
  try{ bmp = await createImageBitmap(file); }catch(e){ throw new Error("Não foi possível ler essa imagem. Envie em JPG, PNG ou PDF."); }
  let scale=Math.min(1, 2200/Math.max(bmp.width,bmp.height)), q=0.85;
  for(let i=0;i<7;i++){
    const c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(bmp.width*scale)); c.height=Math.max(1,Math.round(bmp.height*scale));
    const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q));
    if(blob && blob.size<=target) return blob;
    q=Math.max(0.5,q-0.1); scale*=0.82;
  }
  throw new Error("A imagem continua grande demais mesmo comprimida. Tire uma foto mais próxima do comprovante.");
}
const asciiName = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9._-]+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"").slice(0,80);
async function uploadReceipt(file, folder, n, item){
  let blob=file, type=(file.type||"").toLowerCase(), ext=(file.name.split(".").pop()||"").toLowerCase();
  if(!type && ext==="pdf") type="application/pdf";
  const isImg=/^image\//.test(type);
  if(isImg && (file.size>1500000 || !/^image\/(jpeg|png|webp)$/.test(type))){ blob=await shrinkImage(file,1500000); type="image/jpeg"; ext="jpg"; }
  else if(!isImg && type!=="application/pdf") throw new Error("Envie o comprovante em JPG, PNG ou PDF.");
  if(blob.size>20*1048576) throw new Error("O arquivo passa de 20 MB. Comprima o PDF ou envie uma foto.");
  const name=`${String(n).padStart(2,"0")}-${asciiName(item.category)}-${item.date}.${ext}`;
  const path=`${myId()}/${folder}/${Date.now().toString(36)}-${name}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType:type, upsert:false });
  if(error) throw new Error("Não foi possível enviar o comprovante: "+dbMessage(error));
  return { receipt_path:path, receipt_name:name, receipt_type:type };
}
async function openReceipt(path){
  const w = window.open("", "_blank");
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 600);
  if(error || !data){ if(w) w.close(); S.flash={kind:"warn", text:"Não foi possível abrir o comprovante: "+dbMessage(error)}; render(); return; }
  if(w) w.location = data.signedUrl; else location.href = data.signedUrl;
}

const stepsHTML = steps => steps.length ? `<div class="progress" role="status">${steps.map(h).join("<br>")}</div>` : "";

async function submitForm(){
  const f=S.form, err={};
  const editing = S.editId ? S.requests.find(r=>r.id===S.editId) : null;
  const ref = editing ? isoLocal(new Date(editing.created_at)) : todayISO();
  const items = f.items||[];
  if(!f.title || f.title.trim().length<3) err.title="Dê um título curto, por exemplo “Visita a clientes em Campinas”.";
  if(!f.cost_center) err.cost_center="Selecione o motivo ou centro de custo.";
  if(!f.partner || f.partner.trim().length<2) err.partner="Informe o parceiro e loja, fornecedor, prospect ou evento.";
  if(f.on_behalf==="sim" && !(f.on_behalf_of||"").trim()) err.on_behalf_of="Informe para quem é o reembolso.";
  if(!f.pix || f.pix.trim().length<4) err.pix="Informe a chave Pix ou a conta bancária para o pagamento.";
  if(!items.length) err.items="Inclua pelo menos uma despesa.";
  items.forEach((it,i)=>{
    const k=x=>`i${i}_${x}`;
    if(!it.date) err[k("date")]="Informe a data.";
    else if(it.date>todayISO()) err[k("date")]="A data não pode estar no futuro.";
    else if(!monthOpen(it.date, ref)) err[k("date")]=`O prazo para despesas de ${monthName(it.date)} terminou em ${fmtDate(deadlineFor(it.date.slice(0,7)))}.`;
    if(!it.category) err[k("category")]="Escolha a categoria.";
    if(it.category==="Km"){ if(!(parseMoney(it.km)>0)) err[k("km")]="Informe os quilômetros rodados, ex.: 120."; }
    else if(!(parseMoney(it.amount)>0)) err[k("amount")]="Informe o valor, ex.: 89,90.";
    if(!it.description || it.description.trim().length<3) err[k("description")] = it.category==="Outros" ? "Em “Outros”, descreva qual é a despesa." : it.category==="Km" ? "Informe o trajeto, ex.: escritório até cliente X, ida e volta." : "Descreva a despesa.";
    if(!it.file && !it.receipt_path && it.category!=="Km") err[k("receipt")]="Anexe o comprovante.";
  });
  S.formErr=err;
  if(Object.keys(err).length){ renderForm(); const first=document.querySelector("form.sheet .err"); if(first) first.scrollIntoView({block:"center"}); return; }

  S.formBusy=true; S.formSteps=[]; renderForm();
  const step = t => { S.formSteps.push(t); renderForm(); };
  try{
    const folder = editing ? editing.id : (f.folder || (f.folder = crypto.randomUUID()));
    const withFiles=items.filter(it=>it.file).length; let sent=0;
    for(let i=0;i<items.length;i++){
      const it=items[i];
      if(it.file){
        sent++; step(`Enviando comprovante ${sent} de ${withFiles}…`);
        Object.assign(it, await uploadReceipt(it.file, folder, i+1, it));
        it.file=null;
      }
    }
    const clean=items.map(it=>{ const isKm=it.category==="Km";
      return { date:it.date, category:it.category, amount:itemValue(it), km:isKm?parseMoney(it.km):null, description:it.description.trim(),
        receipt_path:it.receipt_path||null, receipt_name:it.receipt_name||null, receipt_type:it.receipt_type||null }; });
    const payload={ title:f.title.trim(), cost_center:f.cost_center, partner:f.partner.trim(), on_behalf:f.on_behalf==="sim",
      on_behalf_of:f.on_behalf==="sim"?(f.on_behalf_of||"").trim():null, pix:f.pix.trim(), items:clean };
    step("Registrando a solicitação…");
    const now=new Date().toISOString();
    let res;
    if(editing){
      const history=[...(editing.history||[]), {at:now, by_name:S.profile.full_name, action:"reenviado", comment:(f.note||"").trim()}];
      res = await sb.from("requests").update({...payload, status:"aguardando_financeiro", history}).eq("id", editing.id).select().single();
    } else {
      res = await sb.from("requests").insert({...payload, history:[{at:now, by_name:S.profile.full_name, action:"enviado", comment:""}]}).select().single();
    }
    if(res.error) throw res.error;
    S.flash={kind:"ok", text:`Solicitação ${res.data.code} de ${brl(res.data.total)} enviada para o financeiro.`};
    S.showForm=false; S.editId=null; S.form={}; S.formErr={}; S.openId=res.data.id;
    await loadRequests();
  }catch(e){
    S.formErr={submit: e instanceof Error && !e.code ? e.message : dbMessage(e)};
  }finally{ S.formBusy=false; S.formSteps=[]; render(); }
}

async function act(id, kind){
  const r=S.requests.find(x=>x.id===id); if(!r) return;
  const comment=(S.comment[id]||"").trim();
  if((kind==="devolvido"||kind==="recusado") && comment.length<3){
    S.steps[id]=["Escreva um comentário explicando o motivo."]; render(); const t=document.getElementById("cmt-"+id); if(t) t.focus(); return;
  }
  const upd={ status:kind, history:[...(r.history||[]), {at:new Date().toISOString(), by_name:S.profile.full_name, action:kind, comment}] };
  if(kind==="pago") upd.paid_date=S.payDate[id]||todayISO();
  S.busy[id]=kind; S.steps[id]=["Salvando…"]; render();
  const { error } = await sb.from("requests").update(upd).eq("id", id);
  if(error){ S.steps[id]=[dbMessage(error)]; }
  else { S.comment[id]=""; S.steps[id]=[]; S.flash={kind:"ok", text:`${r.code}: ${STATUS[kind]}.`}; await loadRequests(); }
  S.busy[id]=null; render();
}

/* ---------- autenticação ---------- */
const redirectTo = () => location.origin + location.pathname;
function authErrorMessage(e){
  const m=(e&&e.message)||"";
  if(/invalid login credentials/i.test(m)) return "E-mail ou senha incorretos.";
  if(/email not confirmed/i.test(m)) return "Confirme seu e-mail pelo link que enviamos antes de entrar.";
  if(/already registered|already exists/i.test(m)) return "Este e-mail já tem cadastro. Use “Entrar” ou “Esqueci minha senha”.";
  if(/rate limit|too many/i.test(m)) return "Muitas tentativas seguidas. Aguarde alguns minutos e tente de novo.";
  if(/password/i.test(m) && /least|short|weak/i.test(m)) return "A senha precisa ter pelo menos 8 caracteres.";
  return dbMessage(e);
}
async function authSubmit(){
  const a=S.auth, mode=S.authMode;
  S.authErr=null; S.authMsg=null;
  const email=(a.email||"").trim().toLowerCase();
  if(mode!=="recovery" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ S.authErr="Informe um e-mail válido."; return renderAuth(); }
  if(mode==="signup"){
    if(!(a.name||"").trim()) { S.authErr="Informe seu nome completo."; return renderAuth(); }
    if((a.password||"").length<8){ S.authErr="A senha precisa ter pelo menos 8 caracteres."; return renderAuth(); }
    if(a.password!==a.password2){ S.authErr="As senhas não conferem."; return renderAuth(); }
  }
  if(mode==="recovery"){
    if((a.password||"").length<8){ S.authErr="A senha precisa ter pelo menos 8 caracteres."; return renderAuth(); }
    if(a.password!==a.password2){ S.authErr="As senhas não conferem."; return renderAuth(); }
  }
  S.authBusy=true; renderAuth();
  try{
    if(mode==="login"){
      const { error } = await sb.auth.signInWithPassword({ email, password:a.password||"" });
      if(error) throw error;
    } else if(mode==="signup"){
      const { data, error } = await sb.auth.signUp({ email, password:a.password, options:{ data:{ full_name:a.name.trim() }, emailRedirectTo:redirectTo() } });
      if(error) throw error;
      if(!data.session){ S.authMode="login"; S.auth={email}; S.authMsg=`Enviamos um link de confirmação para ${email}. Depois de confirmar, seu acesso aguarda a aprovação da administradora.`; }
    } else if(mode==="forgot"){
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo:redirectTo() });
      if(error) throw error;
      S.authMode="login"; S.authMsg=`Se houver uma conta com ${email}, enviamos um link para criar uma nova senha.`;
    } else if(mode==="recovery"){
      const { error } = await sb.auth.updateUser({ password:a.password });
      if(error) throw error;
      S.authMode="login"; S.auth={}; S.flash={kind:"ok", text:"Senha alterada."};
      await loadAll(); return;
    }
  }catch(e){ S.authErr=authErrorMessage(e); }
  finally{ S.authBusy=false; }
  render();
}

function preserveFocus(fn){
  const a=document.activeElement, id=a&&a.id, s=a&&a.selectionStart, e=a&&a.selectionEnd;
  fn();
  if(id){ const n=document.getElementById(id); if(n && n!==document.activeElement){ n.focus(); try{ if(s!=null) n.setSelectionRange(s,e); }catch(_){} } }
}
function render(){ preserveFocus(()=>{ renderHeader(); renderTabs(); renderBanner(); renderView(); }); }

function go(mod){
  if(!ROUTES.includes(mod)) mod="home";
  S.module=mod; S.openId=null; S.draft=null; S.flash=null;

function processStatus(p){
  if(p.id==="ti") return tiProcessStatus();
  if(p.id!=="reembolsos" || !S.reqLoaded) return "";
  const mine=S.requests.filter(isMine);
  const back=mine.filter(r=>r.status==="devolvido").length;
  const open=mine.filter(r=>!["pago","recusado","devolvido"].includes(r.status)).length;
  const parts=[];
  if(isStaff()){ const n=S.requests.filter(pendingFin).length; if(n) parts.push(`<span class="pill hot">${n} para analisar</span>`); }
  if(back) parts.push(`<span class="pill warn">${back} ${back===1?"devolvida":"devolvidas"} para ajuste</span>`);
  if(open) parts.push(`<span class="pill">${open} em andamento</span>`);
  return parts.join("");
}

    <div class="field" style="max-width:260px;margin-bottom:16px"><label for="kmrate">Valor por km rodado (R$)</label><input type="text" inputmode="decimal" id="kmrate" data-kmrate value="${h(d.km_rate)}"><span class="hint">Usado na categoria Km</span></div>
    <p class="small" style="margin:0 0 8px;font-weight:500">Teto por categoria (R$, deixe vazio para sem teto)</p>
    <div class="limits">${CATEGORIES.map((cat,i)=>`<div class="field"><label for="lim-${i}">${h(cat)}</label><input type="text" inputmode="decimal" id="lim-${i}" data-lim="${h(cat)}" value="${h(d.limits[cat]?String(d.limits[cat]).replace(".",","):"")}"></div>`).join("")}</div>
  </div>
  <div class="formfoot"><button class="btn primary" data-action="save-config" ${S.busy.config?"disabled":""}>${S.busy.config?"Salvando…":"Salvar política"}</button></div>

}

/* =====================================================================
   PROCESSO: CHAMADOS DE TI
   ===================================================================== */
const TI_BUCKET = "chamados-anexos";
const TI_STATUS = {
  aberto:"Em análise do TI", aguardando_material:"Aguardando material", em_andamento:"Em andamento",
  congelado:"Congelado", concluido:"Concluído", cancelado:"Cancelado"
};
const TI_ACTION = {
  aberto:"Abriu o chamado", reuniao:"Agendou a reunião", previsao:"Confirmou os materiais e deu a previsão",
  falta_material:"Pediu material pendente", prazo_revisado:"Revisou o prazo", material_enviado:"Enviou o material pedido",
  congelado:"Congelou o chamado", descongelado:"Retomou o chamado", concluido:"Concluiu o chamado",
  cancelado:"Cancelou o chamado", comentario:"Comentou"
};
const TI_CATS = ["Acesso e permissões","Sistema ou ferramenta","Relatório ou dashboard","Automação","Integração entre sistemas","Equipamento","Suporte ou problema","Outro"];
const TI_URG = ["Baixa","Média","Alta"];
const TI_ACTIVE = ["aberto","aguardando_material","em_andamento"];
const TI_TYPES = { pdf:"application/pdf", jpg:"image/jpeg", jpeg:"image/jpeg", png:"image/png", webp:"image/webp", gif:"image/gif",
  txt:"text/plain", csv:"text/csv", zip:"application/zip", doc:"application/msword", xls:"application/vnd.ms-excel", ppt:"application/vnd.ms-powerpoint",
  docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  pptx:"application/vnd.openxmlformats-officedocument.presentationml.presentation" };
const TI_ACCEPT = Object.keys(TI_TYPES).map(x=>"."+x).join(",");
const T = { list:[], loaded:false, loadErr:null, tab:"meus", openId:null,
  showForm:false, form:{}, formErr:{}, formBusy:false, formSteps:[],
  inp:{}, mode:{}, files:{}, busy:{}, steps:{} };

/* ---------- utilidades ---------- */
const isTI = () => !!(S.profile && (S.profile.ti || isAdmin()));
const tiMine = c => c.requester_id===myId();
const tiDays = (a,b) => Math.round((new Date(String(b).slice(0,10)+"T12:00:00")-new Date(String(a).slice(0,10)+"T12:00:00"))/86400000);
const tiLate = c => c.status==="em_andamento" && c.prazo && c.prazo<todayISO();
const tiReviewDue = c => c.status==="congelado" && (c.resume_on ? c.resume_on<=todayISO() : tiDays(c.frozen_at||c.updated_at, todayISO())>=30);
function tiWhenMeeting(v){ if(!v) return ""; const d=new Date(v); return isNaN(d) ? v : d.toLocaleString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }
function tiLocalDT(iso){ if(!iso) return ""; const d=new Date(iso), p=n=>String(n).padStart(2,"0"); return `${isoLocal(d)}T${p(d.getHours())}:${p(d.getMinutes())}`; }
const tiV = (id,k) => ((T.inp[id]||{})[k]) || "";
const tiSortBy = (a,key) => [...a].sort((x,y)=>String(x[key]||"9999").localeCompare(String(y[key]||"9999")));
const tiPre = s => h(s).replace(/(https?:\/\/[^\s<]+)/g, u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
function tiDbMessage(e){
  const m=(e&&e.message)||"";
  if(/chamados.*(does not exist|schema cache)|relation .*chamados/i.test(m)) return "O banco ainda não tem as tabelas de chamados. Rode o arquivo chamados-ti.sql no SQL Editor do Supabase.";
  return dbMessage(e);
}

/* ---------- anexos ---------- */
async function tiUpload(file, folder){
  let blob=file, ext=(file.name.split(".").pop()||"").toLowerCase(), type=TI_TYPES[ext]||(file.type||"").toLowerCase();
  if(!Object.values(TI_TYPES).includes(type)) throw new Error(`“${file.name}”: tipo de arquivo não aceito. Envie PDF, imagem, Word, Excel, PowerPoint, CSV, TXT ou ZIP.`);
  if(/^image\//.test(type) && type!=="image/gif" && file.size>1500000){ blob=await shrinkImage(file,1500000); type="image/jpeg"; ext="jpg"; }
  if(blob.size>20*1048576) throw new Error(`“${file.name}” passa de 20 MB.`);
  const base=asciiName(file.name.replace(/\.[^.]+$/,""))||"arquivo";
  const path=`${myId()}/${folder}/${Date.now().toString(36)}-${base}.${ext}`;
  const { error } = await sb.storage.from(TI_BUCKET).upload(path, blob, { contentType:type, upsert:false });
  if(error) throw new Error(`Não foi possível enviar “${file.name}”: ${dbMessage(error)}`);
  return { path, name:file.name, type, size:blob.size, by_name:S.profile.full_name, at:new Date().toISOString() };
}
async function tiUploadAll(key, folder, step){
  const fs=T.files[key]||[], out=[];
  for(let i=0;i<fs.length;i++){ step(`Enviando arquivo ${i+1} de ${fs.length}…`); out.push(await tiUpload(fs[i], folder)); }
  return out;
}
async function tiOpenFile(path){
  const w=window.open("", "_blank");
  const { data, error } = await sb.storage.from(TI_BUCKET).createSignedUrl(path, 600);
  if(error || !data){ if(w) w.close(); S.flash={kind:"warn", text:"Não foi possível abrir o arquivo: "+dbMessage(error)}; render(); return; }
  if(w) w.location=data.signedUrl; else location.href=data.signedUrl;
}
const tiFilesHint = key => { const fs=T.files[key]||[]; return fs.length ? fs.map(f=>h(f.name)).join(", ") : "PDF, imagem, Word, Excel, PowerPoint, CSV ou ZIP, até 20 MB cada"; };

/* ---------- carregamento ---------- */
async function loadChamados(){
  const { data, error } = await sb.from("chamados").select("*").order("updated_at",{ascending:false});
  if(error){ T.loadErr=tiDbMessage(error); } else { T.list=data||[]; T.loadErr=null; }
  T.loaded=true;
}

/* ---------- abrir chamado ---------- */
async function tiSubmit(){
  const f=T.form, err={};
  if(!f.title || f.title.trim().length<3) err.title="Dê um título curto, por exemplo “Relatório de vendas por loja”.";
  if(!f.category) err.category="Escolha o tipo de demanda.";
  if(!f.description || f.description.trim().length<10) err.description="Explique a demanda: o que precisa, para quem e por quê.";
  if(f.needs_meeting!=="sim" && f.needs_meeting!=="nao") err.needs_meeting="Diga se precisa de uma reunião para explicar a demanda.";
  if(f.desired_date && f.desired_date<todayISO()) err.desired_date="A data desejada não pode estar no passado.";
  T.formErr=err;
  if(Object.keys(err).length){ tiRenderForm(); const first=document.querySelector("#ti-form .err"); if(first) first.scrollIntoView({block:"center"}); return; }
  T.formBusy=true; T.formSteps=[]; tiRenderForm();
  const step=t=>{ T.formSteps.push(t); tiRenderForm(); };
  try{
    const id=f.id||(f.id=crypto.randomUUID());
    if(!f.uploaded) f.uploaded=await tiUploadAll("new", id, step);
    step("Registrando o chamado…");
    const now=new Date().toISOString();
    const res=await sb.from("chamados").insert({
      id, title:f.title.trim(), category:f.category, urgency:f.urgency||"Média", desired_date:f.desired_date||null,
      description:f.description.trim(), needs_meeting:f.needs_meeting==="sim", meeting_pref:f.needs_meeting==="sim"?(f.meeting_pref||"").trim():null,
      materials:(f.materials||"").trim()||null, attachments:f.uploaded,
      history:[{at:now, by_name:S.profile.full_name, action:"aberto", comment:""}]
    }).select().single();
    if(res.error) throw res.error;
    S.flash={kind:"ok", text:`Chamado ${res.data.code} aberto. A equipe de TI vai verificar se tem tudo o que precisa.`};
    T.showForm=false; T.form={}; T.formErr={}; T.files.new=[]; T.openId=res.data.id;
    await loadChamados();
  }catch(e){
    T.formErr={submit: e instanceof Error && !e.code ? e.message : tiDbMessage(e)};
  }finally{ T.formBusy=false; T.formSteps=[]; render(); }
}

/* ---------- ações ---------- */
const TI_MODES = {
  previsao:{label:c=>c.status==="aguardando_material"?"Material completo, dar previsão":"Tenho tudo, dar previsão", cls:"ok"},
  falta:{label:c=>c.status==="aguardando_material"?"Atualizar pendências":c.status==="em_andamento"?"Solicitar material":"Falta material", cls:""},
  revisar:{label:()=>"Revisar prazo", cls:""},
  reuniao:{label:c=>c.meeting_at?"Remarcar reunião":"Registrar reunião", cls:""},
  concluir:{label:()=>"Concluir", cls:"ok"},
  congelar:{label:()=>"Congelar", cls:""},
  descongelar:{label:()=>"Retomar chamado", cls:"ok"},
  material:{label:()=>"Enviar material pendente", cls:"primary"},
  comentario:{label:()=>"Comentar", cls:""},
  cancelar:{label:()=>"Cancelar chamado", cls:"bad"}
};
function tiModesFor(c){
  const out=[], it=isTI(), mine=tiMine(c), s=c.status;
  if(mine && s==="aguardando_material") out.push("material");
  if(it){
    if(s==="aberto"||s==="aguardando_material") out.push("previsao","falta");
    if(s==="em_andamento") out.push("concluir","revisar","falta");
    if(s==="aguardando_material" && c.prazo) out.push("revisar");
    if(TI_ACTIVE.includes(s) && c.needs_meeting) out.push("reuniao");
    if(TI_ACTIVE.includes(s)) out.push("congelar");
    if(s==="congelado") out.push("descongelar");
  }
  if((it||mine) && (TI_ACTIVE.includes(s)||s==="congelado")) out.push("comentario","cancelar");
  return [...new Set(out)];
}
function tiModeForm(c, mode){
  const id=c.id, busy=T.busy[id]?"disabled":"", today=todayISO();
  const fld=(k,label,type,extra)=>`<div class="field"><label for="tc-${h(id)}-${k}">${label}</label>${type==="area"
      ?`<textarea id="tc-${h(id)}-${k}" data-tc="${h(id)}" data-k="${k}" ${extra||""} ${busy}>${h(tiV(id,k))}</textarea>`
      :`<input type="${type}" id="tc-${h(id)}-${k}" data-tc="${h(id)}" data-k="${k}" value="${h(tiV(id,k))}" ${extra||""} ${busy}>`}</div>`;
  let body="", go="Confirmar";
  if(mode==="previsao"){ body=fld("prazo","Previsão de entrega","date",`min="${today}"`)+fld("comment","Observação para o solicitante (opcional)","area"); go="Confirmar previsão"; }
  else if(mode==="falta"){ body=fld("pending","O que ainda falta","area",`placeholder="Liste o material pendente, um item por linha"`)
      +fld("prazo",c.prazo?"Prazo revisado (opcional, mantém o atual se ficar vazio)":"Prazo estimado (opcional)","date",`min="${today}"`)
      +(c.prazo?fld("comment","Motivo da mudança de prazo (se mudar)","text"):""); go="Pedir material"; }
  else if(mode==="revisar"){ body=fld("prazo","Novo prazo","date",`min="${today}"`)+fld("comment","Motivo da revisão","area"); go="Revisar prazo"; }
  else if(mode==="reuniao"){ body=(c.meeting_pref?`<p class="small muted" style="margin:0">Disponibilidade informada: ${h(c.meeting_pref)}</p>`:"")
      +fld("meeting_at","Data e hora da reunião","datetime-local")+fld("comment","Link ou local (opcional)","text"); go="Registrar reunião"; }
  else if(mode==="concluir"){ body=fld("comment","O que foi entregue (opcional)","area"); go="Concluir chamado"; }
  else if(mode==="congelar"){ body=`<p class="small muted" style="margin:0">O chamado sai da fila ativa e fica na aba Congelados, sem ser esquecido.</p>`
      +fld("comment","Por que não será priorizado agora","area")+fld("resume_on","Revisitar em (opcional)","date",`min="${today}"`); go="Congelar chamado"; }
  else if(mode==="descongelar"){ body=fld("comment","Observação (opcional)","text"); go="Retomar"; }
  else if(mode==="material"){ body=`<div class="notice" style="margin:0"><strong>Pendente:</strong><br>${tiPre(c.pending||"")}</div>`
      +fld("comment","O que você está enviando","area",`placeholder="Descreva o material e cole links, se houver"`)
      +`<div class="field"><label for="tfile-${h(id)}">Anexos (opcional)</label><input type="file" multiple id="tfile-${h(id)}" data-tfile="${h(id)}" accept="${TI_ACCEPT}" ${busy}><span class="hint">${tiFilesHint(id)}</span></div>`; go="Enviar para o TI"; }
  else if(mode==="comentario"){ body=fld("comment","Comentário","area"); go="Enviar comentário"; }
  else if(mode==="cancelar"){ body=fld("comment","Motivo do cancelamento","area"); go="Cancelar chamado"; }
  return `<div class="tiform">${body}
    <div class="btns"><button class="btn ${mode==="cancelar"?"bad":"primary"}" data-ta="do" data-id="${h(id)}" data-mode="${mode}" ${busy}>${T.busy[id]?"Salvando…":go}</button>
    <button class="btn" data-ta="mode" data-id="${h(id)}" data-mode="" ${busy}>Voltar</button></div></div>`;
}
function tiActionsHTML(c){
  const modes=tiModesFor(c); if(!modes.length) return "";
  const cur=T.mode[c.id];
  const inner = cur ? tiModeForm(c, cur)
    : `<p class="lbl" style="margin:0">${isTI()&&c.status==="aberto"?"Verificação do TI: os materiais estão completos?":"Ações"}</p>
       <div class="btns">${modes.map(m=>`<button class="btn ${TI_MODES[m].cls}" data-ta="mode" data-id="${h(c.id)}" data-mode="${m}">${h(TI_MODES[m].label(c))}</button>`).join("")}</div>`;
  return `<div class="actions">${inner}${stepsHTML(T.steps[c.id]||[])}</div>`;
}

async function tiDo(id, mode){
  const c=T.list.find(x=>x.id===id); if(!c) return;
  const v=k=>tiV(id,k).trim();
  const fail=(msg,k)=>{ T.steps[id]=[msg]; render(); const el=document.getElementById(`tc-${id}-${k}`); if(el) el.focus(); };
  const today=todayISO(), comment=v("comment");
  let upd={}, action="", entry={};
  if(mode==="previsao"){
    if(!v("prazo")) return fail("Informe a previsão de entrega.","prazo");
    if(v("prazo")<today) return fail("A previsão não pode estar no passado.","prazo");
    upd={status:"em_andamento", prazo:v("prazo")}; action="previsao";
  } else if(mode==="falta"){
    if(v("pending").length<3) return fail("Liste o que ainda falta.","pending");
    if(v("prazo") && v("prazo")<today) return fail("O prazo não pode estar no passado.","prazo");
    upd={status:"aguardando_material", pending:v("pending")}; if(v("prazo")) upd.prazo=v("prazo");
    action="falta_material"; entry.pending=v("pending");
  } else if(mode==="revisar"){
    if(!v("prazo")) return fail("Informe o novo prazo.","prazo");
    if(v("prazo")<today) return fail("O prazo não pode estar no passado.","prazo");
    if(v("prazo")===c.prazo) return fail("O novo prazo é igual ao atual.","prazo");
    if(comment.length<3) return fail("Explique o motivo da revisão.","comment");
    upd={prazo:v("prazo")}; action="prazo_revisado";
  } else if(mode==="reuniao"){
    if(!v("meeting_at")) return fail("Informe a data e a hora da reunião.","meeting_at");
    upd={meeting_at:new Date(v("meeting_at")).toISOString()}; action="reuniao"; entry.meeting_at=upd.meeting_at;
  } else if(mode==="concluir"){
    upd={status:"concluido"}; action="concluido";
  } else if(mode==="congelar"){
    if(comment.length<3) return fail("Explique por que o chamado não será priorizado agora.","comment");
    if(v("resume_on") && v("resume_on")<today) return fail("A data para revisitar não pode estar no passado.","resume_on");
    upd={status:"congelado", frozen_reason:comment, resume_on:v("resume_on")||null}; action="congelado";
  } else if(mode==="descongelar"){
    upd={status:TI_ACTIVE.includes(c.prev_status)?c.prev_status:"aberto"}; action="descongelado";
  } else if(mode==="material"){
    if(comment.length<3 && !(T.files[id]||[]).length) return fail("Descreva o que está enviando ou anexe um arquivo.","comment");
    upd={status:"aberto"}; action="material_enviado";
  } else if(mode==="comentario"){
    if(comment.length<2) return fail("Escreva o comentário.","comment");
    action="comentario";
  } else if(mode==="cancelar"){
    if(comment.length<3) return fail("Explique o motivo do cancelamento.","comment");
    upd={status:"cancelado"}; action="cancelado";
  }
  T.busy[id]=true; T.steps[id]=[]; render();
  const step=t=>{ T.steps[id].push(t); render(); };
  try{
    if(mode==="material"){
      const files=await tiUploadAll(id, c.id, step);
      if(files.length){ upd.attachments=[...(c.attachments||[]), ...files]; entry.files=files.length; }
    }
    step("Salvando…");
    if(upd.prazo && upd.prazo!==c.prazo) entry.prazo=upd.prazo;
    upd.history=[...(c.history||[]), {at:new Date().toISOString(), by_name:S.profile.full_name, action, comment, ...entry}];
    const { error } = await sb.from("chamados").update(upd).eq("id", id);
    if(error) throw error;
    T.inp[id]={}; T.mode[id]=""; T.steps[id]=[]; T.files[id]=[];
    S.flash={kind:"ok", text:`${c.code}: ${TI_ACTION[action]}.`};
    await loadChamados();
  }catch(e){
    T.steps[id]=[e instanceof Error && !e.code ? e.message : tiDbMessage(e)];
  }finally{ T.busy[id]=false; render(); }
}

/* ---------- renderização ---------- */
function tiTabs(nav){
  const tabs=[["meus","Meus chamados",0]];
  if(isTI()){
    tabs.push(["fila","Fila do TI",T.list.filter(c=>c.status==="aberto").length]);
    tabs.push(["congelados","Congelados",T.list.filter(c=>c.status==="congelado").length]);
  }
  if(!tabs.some(t=>t[0]===T.tab)) T.tab="meus";
  nav.innerHTML = tabs.map(([k,l,n])=>`<button data-titab="${k}" ${T.tab===k?'aria-current="page"':""}>${h(l)}${n?`<span class="count">${n}</span>`:""}</button>`).join("");
}
function tiPrazoTxt(c){
  if(c.status==="concluido") return c.done_at?`Entregue ${fmtDateShort(c.done_at)}`:"Entregue";
  if(c.status==="cancelado") return "";
  return c.prazo ? `Prazo ${fmtDateShort(c.prazo)}` : "Sem prazo";
}
function tiRow(c){
  const open=T.openId===c.id, last=(c.history||[]).slice(-1)[0], flags=[];
  if(c.needs_meeting && !c.meeting_at && TI_ACTIVE.includes(c.status)) flags.push("Pediu reunião");
  if(c.meeting_at && TI_ACTIVE.includes(c.status) && isoLocal(new Date(c.meeting_at))>=todayISO()) flags.push(`Reunião ${fmtDateShort(isoLocal(new Date(c.meeting_at)))}`);
  if(tiLate(c)) flags.push("Atrasado");
  if(c.prazo_revisions && TI_ACTIVE.includes(c.status)) flags.push(c.prazo_revisions===1?"Prazo revisado":`Prazo revisado ${c.prazo_revisions}x`);
  if(c.status==="aberto" && last && last.action==="material_enviado") flags.push("Material recebido");
  if(c.status==="aguardando_material" && tiMine(c)) flags.push("Envie o material");
  if(tiReviewDue(c)) flags.push("Hora de revisitar");
  if(c.urgency==="Alta" && TI_ACTIVE.includes(c.status)) flags.push("Urgência alta");
  return `<div><button class="row" data-tiopen="${h(c.id)}" aria-expanded="${open}">
    <div class="stub"><span class="code">${h(c.code)}</span><span class="date">${h(fmtDateShort(c.created_at))}</span></div>
    <div class="rbody"><div class="desc">${h(c.title)}</div>
      <div class="meta"><span>${h(c.category)}</span>${T.tab!=="meus"?`<span>${h(c.requester_name)}</span>`:""}${flags.map(f=>`<span class="flag${f==="Atrasado"?" late":""}">${h(f)}</span>`).join("")}</div></div>
    <div class="rend"><span class="prz${tiLate(c)?" late":""}">${h(tiPrazoTxt(c))}</span><span class="badge t-${h(c.status)}">${h(TI_STATUS[c.status]||c.status)}</span></div>
  </button>${open?tiDetail(c):""}</div>`;
}
function tiDetail(c){
  const hist=(c.history||[]).map(e=>`<li><span class="when">${h(fmtWhen(e.at))}</span>, ${h(e.by_name||"Alguém")}: ${h(TI_ACTION[e.action]||e.action)}${e.prazo?`, prazo ${h(fmtDate(e.prazo))}`:""}${e.meeting_at?`, ${h(tiWhenMeeting(e.meeting_at))}`:""}${e.files?`, ${e.files} anexo${e.files>1?"s":""}`:""}${e.pending?`<span class="cmt">Pendente: ${h(e.pending)}</span>`:""}${e.comment?`<span class="cmt">“${h(e.comment)}”</span>`:""}</li>`).join("");
  const att=(c.attachments||[]).map(a=>`<li><button class="btn link" data-tifile="${h(a.path)}">${h(a.name)}</button> <span class="muted small">${h(a.by_name||"")}${a.at?`, ${h(fmtDateShort(a.at))}`:""}</span></li>`).join("");
  const meeting = !c.needs_meeting ? "Não foi pedida" : c.meeting_at ? `Agendada: ${tiWhenMeeting(c.meeting_at)}` : `Pedida${c.meeting_pref?`, disponibilidade: ${c.meeting_pref}`:", ainda não agendada"}`;
  const prazo = c.prazo ? `${fmtDate(c.prazo)}${c.prazo_revisions?` (revisado ${c.prazo_revisions}x, original ${fmtDate(c.prazo_original)})`:""}${tiLate(c)?`, atrasado ${tiDays(c.prazo,todayISO())} dia(s)`:""}` : "Ainda não definido";
  return `<section class="detail" aria-label="Detalhes de ${h(c.code)}">

function tiRenderFrozen(v){
  const fz=T.list.filter(c=>c.status==="congelado").sort((a,b)=>(tiReviewDue(b)-tiReviewDue(a)) || String(a.resume_on||"9").localeCompare(String(b.resume_on||"9")) || String(a.frozen_at).localeCompare(String(b.frozen_at)));
  v.innerHTML=`<div class="bar"><h2>Congelados</h2></div>
    <p class="muted small" style="margin-top:0">Chamados que não serão priorizados agora, mas não podem ser esquecidos. Aparecem primeiro os que chegaram na data de revisitar ou estão congelados há 30 dias ou mais sem data.</p>
    ${tiList(fz,"Nenhum chamado congelado.")}`;

function tiProcessStatus(){
  if(!T.loaded) return "";
  const mine=T.list.filter(tiMine), parts=[];
  if(isTI()){
    const n=T.list.filter(c=>c.status==="aberto").length, late=T.list.filter(tiLate).length, due=T.list.filter(tiReviewDue).length;
    if(n) parts.push(`<span class="pill hot">${n} para analisar</span>`);
    if(late) parts.push(`<span class="pill warn">${late} ${late===1?"atrasado":"atrasados"}</span>`);
    if(due) parts.push(`<span class="pill warn">${due} congelado${due>1?"s":""} para revisitar</span>`);
  }
  const wait=mine.filter(c=>c.status==="aguardando_material").length, open=mine.filter(c=>c.status==="aberto"||c.status==="em_andamento").length;
  if(wait) parts.push(`<span class="pill warn">${wait} aguardando seu material</span>`);
  if(open) parts.push(`<span class="pill">${open} em andamento</span>`);
  return parts.join("");
}

function tiClick(t){
  if(t.dataset.titab){ T.tab=t.dataset.titab; T.openId=null; render(); return true; }
  if(t.dataset.tiopen){ T.openId = T.openId===t.dataset.tiopen ? null : t.dataset.tiopen; render(); return true; }
  if(t.dataset.tifile){ tiOpenFile(t.dataset.tifile); return true; }
  const a=t.dataset.ta; if(!a) return false;
  if(a==="new"){ T.showForm=true; T.form={urgency:"Média"}; T.formErr={}; T.files.new=[]; render(); const el=$("#tf-title"); if(el) el.focus(); }
  else if(a==="cancel"){ T.showForm=false; T.form={}; T.formErr={}; T.files.new=[]; render(); }
  else if(a==="mode"){
    const id=t.dataset.id, m=t.dataset.mode, c=T.list.find(x=>x.id===id);
    T.mode[id]=m; T.steps[id]=[]; T.inp[id]={};
    if(c && (m==="revisar"||m==="previsao") && c.prazo && c.prazo>=todayISO()) T.inp[id].prazo=c.prazo;
    if(c && m==="falta" && c.status==="aguardando_material") T.inp[id].pending=c.pending||"";
    if(c && m==="reuniao" && c.meeting_at) T.inp[id].meeting_at=tiLocalDT(c.meeting_at);
    render(); const first=document.getElementById(`tc-${id}-${{previsao:"prazo",falta:"pending",revisar:"prazo",reuniao:"meeting_at"}[m]||"comment"}`); if(first) first.focus();
  }
  else if(a==="do"){ tiDo(t.dataset.id, t.dataset.mode); }
  else if(a==="sheet"){ try{ tiDownloadSheet(); }catch(e){ S.flash={kind:"warn", text:"Não foi possível gerar a planilha."}; render(); } }
  return true;
}
function tiInput(t){
  if(t.dataset.tf){ T.form[t.dataset.tf]=t.value;
    if(T.formErr[t.dataset.tf]){ delete T.formErr[t.dataset.tf]; const e=document.getElementById("ti-err-"+t.dataset.tf); if(e) e.remove(); }
    if(t.dataset.tf==="needs_meeting"){ tiRenderForm(); if(t.value==="sim"){ const x=$("#tf-mp"); if(x) x.focus(); } }
    return true; }
  if(t.dataset.tc){ const id=t.dataset.tc; T.inp[id]=T.inp[id]||{}; T.inp[id][t.dataset.k]=t.value; return true; }
  return false;
}
function tiChange(t){
  if(t.dataset.tfile==null) return false;
  const key=t.dataset.tfile; T.files[key]=Array.from(t.files||[]);
  if(key==="new") T.form.uploaded=null;
  const hint=t.parentElement && t.parentElement.querySelector(".hint"); if(hint) hint.innerHTML=tiFilesHint(key);
  return true;
}

document.addEventListener("click", async ev=>{

    await loadUsers(); S.busy["u"+id]=false; render(); return;
  }
  if(t.dataset.tab){ S.tab=t.dataset.tab; S.openId=null; S.draft=null; render(); return; }
  if(t.dataset.open){ S.openId = S.openId===t.dataset.open ? null : t.dataset.open; render(); return; }

  if(t.dataset.act){ act(t.dataset.id, t.dataset.act); return; }

    await loadUsers(); S.busy["u"+id]=false; render(); return;
  }
  if(t.dataset.edit){
    const r=S.requests.find(x=>x.id===t.dataset.edit); if(!r) return;
    S.editId=r.id; S.showForm=true; S.formErr={};
    S.form={title:r.title, cost_center:r.cost_center, partner:r.partner, on_behalf:r.on_behalf?"sim":"nao", on_behalf_of:r.on_behalf_of||"", pix:r.pix,
      items:(r.items||[]).map(it=>({date:it.date, category:it.category, amount:String(it.amount).replace(".",","), km:it.km?String(it.km).replace(".",","):"", description:it.description,
        receipt_path:it.receipt_path, receipt_name:it.receipt_name, receipt_type:it.receipt_type, file:null}))};
    S.tab="minhas"; S.module="reembolsos"; $("#view").innerHTML=""; render(); window.scrollTo({top:0}); return;
  }
  if(t.dataset.rm!=null){ S.form.items.splice(Number(t.dataset.rm),1); S.formErr={}; renderForm(); return; }
  const a=t.dataset.action; if(!a) return;
  if(a==="dismiss"){ S.flash=null; render(); }
  else if(a==="logout"){ await sb.auth.signOut(); }
  else if(a==="recheck"){ await loadAll(); }
  else if(a==="refresh"){ await refresh(); }
  else if(a==="new"){ S.showForm=true; S.editId=null; S.form={items:[{date:todayISO()}]}; S.formErr={}; render(); const d=$("#f-title"); if(d) d.focus(); }
  else if(a==="cancel"){ S.showForm=false; S.editId=null; S.form={}; S.formErr={}; render(); }
  else if(a==="add-item"){ const last=(S.form.items||[]).slice(-1)[0]; S.form.items=[...(S.form.items||[]), {date:(last&&last.date)||todayISO()}]; delete S.formErr.items; renderForm();
    const n=S.form.items.length-1, el=document.getElementById(`i${n}_category`); if(el){ el.focus(); el.scrollIntoView({block:"center"}); } }
  else if(a==="download-sheet"){ try{ downloadSheet(); }catch(e){ S.flash={kind:"warn", text:"Não foi possível gerar a planilha."}; render(); } }
  else if(a==="save-config"){
    const d=S.draft, limits={};
    for(const [k,val] of Object.entries(d.limits)){ const n=parseMoney(val); if(n>0) limits[k]=n; }
    const kr=parseMoney(d.km_rate);
    S.busy.config=true; S.steps.config=[]; render();
    const { error } = await sb.from("settings").update({ km_rate: kr>0?kr:KM_RATE_DEFAULT, limits }).eq("id",1);
    if(error) S.steps.config=[dbMessage(error)]; else { await loadSettings(); S.draft=null; S.flash={kind:"ok", text:"Política salva."}; }
    S.busy.config=false; render();
  }
});

/* ---------- inicialização ---------- */
(async function init(){
  if(!CONFIGURED){ render(); return; }
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==="INITIAL_SESSION") return;
    if(event==="PASSWORD_RECOVERY"){ S.session=session; S.authMode="recovery"; S.auth={}; render(); return; }
    const had=!!S.session; S.session=session;
    if(!session){ if(location.hash) history.replaceState(null,"",location.pathname+location.search); Object.assign(S,{profile:null, requests:[], users:[], reqLoaded:false, module:"home", tab:"minhas", showForm:false, editId:null, form:{}, authMode:"login"});
      Object.assign(T,{list:[], loaded:false, loadErr:null, tab:"meus", openId:null, showForm:false, form:{}, formErr:{}, inp:{}, mode:{}, files:{}}); render(); }
    else if(!had || event==="SIGNED_IN" && !S.profile){ setTimeout(loadAll,0); }
  });
  routeFromHash();
  const { data } = await sb.auth.getSession();
  S.session=data.session;
  if(S.session && S.authMode!=="recovery") await loadAll(); else render();
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") refresh(); });
  setInterval(()=>{ if(document.visibilityState==="visible" && !S.formBusy && !S.showForm && !T.showForm && !Object.values(T.mode).some(Boolean)) refresh(); }, 60000);
})();

</script>
